<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lab label</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:40px 20px;background:#f3f4f6;color:#111827}main{max-width:420px;margin:0 auto;background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}input{font:inherit;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;width:100%;box-sizing:border-box;margin:8px 0}button{font:inherit;font-weight:600;padding:10px 16px;border:none;border-radius:8px;background:#4f46e5;color:#fff;width:100%}p{color:#6b7280;font-size:14px}</style></head>
<body><main><h1 style="font-size:20px;margin:0 0 6px;">Lab label</h1>
<p>Scanned a label? The code after <code>/l/</code> opens the item. If you landed here without one, type it.</p>
<form id="f"><input id="c" placeholder="MG-A7K2X" autocomplete="off" autocapitalize="characters"><button type="submit">Open</button></form>
<script>
(function(){var seg=location.pathname.replace(/^\/l\/?/,'').split('/')[0];if(seg&&/^[A-Za-z0-9-]{3,24}$/.test(seg)){location.replace('/rm/pages/inventory.html?code='+encodeURIComponent(seg));return;}
document.getElementById('f').onsubmit=function(e){e.preventDefault();var v=document.getElementById('c').value.trim();if(v)location.href='/rm/pages/inventory.html?code='+encodeURIComponent(v);};})();
</script></main></body></html>
