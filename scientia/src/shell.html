<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Scientia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d1d1b">
<title>Scientia In Situ</title>
<style id="vendor-css">/*VENDORCSS*/</style>
<style id="font-css">/*FONTS*/</style>
<style id="app-css">/*CSS*/</style>
<style id="kind-css"></style>
</head>
<body>
<div id="app">
  <header id="hd">
    <div class="hrow">
      <button id="brand" title="Today">SiS</button>
      <div class="ttlw"><span id="ttl" spellcheck="false"></span><span id="meta"></span></div>
      <span class="spacer"></span>
      <div id="timers"></div>
      <button id="search" title="Search (Ctrl+K)"><span>⌕</span><span class="lbl">Search</span><kbd>Ctrl K</kbd></button>
      <button class="ib" id="remindbtn" title="Reminders — deadlines and meetings" aria-label="Reminders">🔔</button>
      <button class="ib" id="capture" title="Capture to today’s day note (Ctrl+Shift+Space)">✎</button>
      <button id="newexp" title="New experiment — starts with its Planning note">+ Experiment</button>
      <button id="newnote" title="New note (Ctrl+Alt+N)">+ Note</button>
      <button class="ib" id="focusbtn" title="Focus session — full screen, locked to the app for a set time" aria-label="Focus session">◎</button>
      <button class="ib" id="themetoggle" title="Light / dark" aria-label="Toggle theme"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg></button>
    </div>
    <nav id="tabs" aria-label="Sections"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="toasts"></div>
<!--WORKERS-->

<script>
/*JS*/
</script>
</body>
</html>
