<script>
/* ── stub DAY_DISTRIBUTE: eight steps, four weeks back through this week; saveOutcome records and flips status ── */
(function () {
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function day(n) { var d = new Date(); d.setDate(d.getDate() + n); return iso(d); }
  var STEPS = [
    { id: 's1', title: 'Run the gel', date: day(0), status: 'planned', created_at: new Date().toISOString() },
    { id: 's2', title: 'Image the gels at 24 h', date: day(-1), status: 'done' },
    { id: 's3', title: 'Coat the beads', date: day(-2), status: 'skipped', outcome: { kind: 'barrier', summary: 'Plasma cleaner down', links: [] } },
    { id: 's4', title: 'Seed MCF10A on gels', date: day(-3), status: 'done', outcome: { kind: 'result', summary: 'good spreading', links: [{ kind: 'notebook_item', boardId: 'nbOLD_u1', itemId: 'zz', title: 'Old card', url: '#' }] } },
    { id: 's5', title: 'Order collagen', date: day(-6), status: 'done' },
    { id: 's6', title: 'Calibrate the confocal', date: day(-9), status: 'planned' },
    { id: 's7', title: 'Write up the TFM method', date: day(-13), status: 'done' },
    { id: 's8', title: 'Cancelled thing', date: day(-4), status: 'cancelled' },
    { id: 's9', title: 'Plan the shear experiment', date: day(-20), status: 'planned' },
  ];
  window.__dd = { saves: [], ranges: [] };
  function closedStatusFor(status, kind, closeAs) {
    if (status === 'planned') { if (kind === 'result') return 'done'; return closeAs === 'done' ? 'done' : 'skipped'; }
    if (status === 'skipped' && kind === 'result') return 'done';
    return status;
  }
  window.DAY_DISTRIBUTE = {
    ITEM_OUTCOME_META: { result: { icon: '✅', label: 'Result' }, barrier: { icon: '🚧', label: 'Barrier' }, no_result: { icon: '◌', label: 'No result' } },
    listRange: async function (from, to) { window.__dd.ranges.push([from, to]); return STEPS.filter(function (s) { return s.date >= from && s.date <= to; }).map(function (s) { return JSON.parse(JSON.stringify(s)); }); },
    saveOutcome: async function (item, payload, opts) {
      window.__dd.saves.push({ id: item.id, payload: JSON.parse(JSON.stringify(payload)), opts: opts || null });
      var real = STEPS.filter(function (s) { return s.id === item.id; })[0];
      var next = closedStatusFor(item.status, payload.kind, opts && opts.closeAs);
      item.status = next; item.outcome = payload;
      if (real) { real.status = next; real.outcome = JSON.parse(JSON.stringify(payload)); }
      return item;
    },
  };
  window.__toastOk = []; window.__toastErr = window.__toastErr || [];
  window.TOAST = { info: function () {}, success: function (m) { window.__toastOk.push(m); }, error: function (m) { window.__toastErr.push(m); } };
})();

  function pop() { return q('.mwr-pop'); }
  function rows() { return qa('.mwr-pop .mwr-row'); }
  function rowOf(id) { return q('.mwr-pop .mwr-row[data-id="' + id + '"]'); }
  function groups() { return qa('.mwr-pop .cw-group').map(function (g) { return g.textContent; }); }
  function sheet() { return q('.wb-sheet-back .wb-sheet'); }
  function finish() { var r = document.getElementById('r'); r.innerHTML = out.join('') + '<div><b>' + (out.length - fails) + '/' + out.length + ' passed</b></div>'; r.dataset.done = '1'; r.dataset.fails = String(fails); }
  try {
    var ready = await until(function () { return qa('.wb-item-widget').length >= 11 && q('.wb-region') && q('.wb-regionref') && (!MOBILE || q('.wb-page.wb-m')); }, 15000);
    check('the entry opens with eleven cards, a region and an instance' + (MOBILE ? ' in mobile mode' : ''), !!ready, qa('.wb-item-widget').length + ' cards');
    if (!ready) { finish(); return; }
    await sleep(500);

    /* ── the ✓ is there, top-left, on cards and regions, not on instances ── */
    var widgets = qa('.wb-item-widget').filter(function (w) { return !w.classList.contains('wb-regionref'); });   // an instance is a mirror, not a card
    check('every card has a ✓ as the FIRST thing in its header', widgets.length >= 11 && widgets.every(function (w) { var h = w.querySelector('.wb-wh'); return h && h.firstElementChild && h.firstElementChild.matches('[data-wb-report].wb-wreport'); }));
    var rh = q('.wb-region .wb-rh');
    check('the region has a ✓ first in its header', !!rh && rh.firstElementChild.matches('[data-wb-report].wb-rreport'));
    check('an instance of a region has no ✓', !q('.wb-regionref [data-wb-report]'));
    check('a fresh card’s ✓ is hollow (not reported yet)', !btn('w1').classList.contains('wb-report-on') && btn('w1').getAttribute('aria-pressed') === 'false' && /Report this as the result/.test(btn('w1').title));
    if (MOBILE) check('on a phone the ✓ is at least 2em so a thumb can hit it', parseFloat(getComputedStyle(btn('w1')).minWidth) > 0);

    /* ── a press on the ✓ never starts a drag (or the phone sheet) ── */
    var x0 = item('w3').x, y0 = item('w3').y; var b3 = btn('w3'); var r3 = b3.getBoundingClientRect();

    /* ── tap the ✓ on the note card → the picker ── */
    await tap(btn('w1'));
    check('the ✓ opens the Report picker anchored to it' + (MOBILE ? ' (no sheet)' : ''), !!pop() && /Report as the result of/.test(pop().textContent) && !sheet());
    check('the picker names the card', !!q('.mwr-pop .mwr-ctitle') && q('.mwr-pop .mwr-ctitle').textContent === 'Setup');
    await until(function () { return rows().length > 0; }, 4000);
    check('steps listed: four weeks back through this week, cancelled left out', rows().length === 8 && !rowOf('s8'), rows().length);
    check('the range asked for is Monday −28 d … Sunday', window.__dd.ranges.length === 1 && /^\d{4}-\d{2}-\d{2}$/.test(window.__dd.ranges[0][0]) && window.__dd.ranges[0][1] > window.__dd.ranges[0][0]);
    check('two groups: Needs a result (6), then Already has an outcome (2)', groups().length === 2 && /Needs a result/.test(groups()[0]) && /Already has an outcome/.test(groups()[1]) && rows().slice(0, 6).every(function (r) { return ['s1','s2','s5','s6','s7','s9'].indexOf(r.dataset.id) >= 0; }), groups());
    check('newest first inside a group (today’s step leads)', rows()[0].dataset.id === 's1');
    check('a row says when and what: Today · planned', /Today · planned/.test(rowOf('s1').textContent) && /Yesterday · done/.test(rowOf('s2').textContent) && /barrier recorded/.test(rowOf('s3').textContent) && /has a result/.test(rowOf('s4').textContent)   /* the icon sweep drew these as monochrome icons, not emoji */);
    check('a search box, since there are more than six', !q('.mwr-pop .cw-pop-q').hidden);
    var qi = q('.mwr-pop .cw-pop-q'); qi.value = 'gel'; qi.dispatchEvent(new Event('input', { bubbles: true })); await sleep(30);
    check('typing filters the steps (gel → 3)', rows().length === 3 && rows().every(function (r) { return /gel/i.test(r.textContent); }), rows().map(function (r) { return r.dataset.id; }));
    qi.value = ''; qi.dispatchEvent(new Event('input', { bubbles: true })); await sleep(30);

    /* ── pick the planned step → reported, done, the card’s ✓ fills ── */
    click(rowOf('s1'));
    await until(function () { return window.__dd.saves.length === 1; }, 4000);
    check('the picker closes and the step is saved through My Week’s writer with closeAs done', !pop() && window.__dd.saves.length === 1 && window.__dd.saves[0].id === 's1' && window.__dd.saves[0].opts && window.__dd.saves[0].opts.closeAs === 'done');
    var L = window.__dd.saves[0].payload.links || [];
    check('the card is the step’s result link, deep-linked to the card', window.__dd.saves[0].payload.kind === 'result' && L.length === 1 && L[0].kind === 'notebook_item' && L[0].entryId === 'nb-m' && L[0].boardId === 'nbM_u1' && L[0].itemId === 'w1' && L[0].title === 'Setup' && L[0].boardTitle === 'Phone entry' && L[0].item_kind === 'note' && L[0].url === '/rm/pages/notebook.html?entry=nb-m&item=w1', L[0]);
    check('toast: reported and marked done', window.__toastOk.length === 1 && /Run the gel/.test(window.__toastOk[0]) && /marked done/.test(window.__toastOk[0]), window.__toastOk);
    await until(function () { return (item('w1').myweek || []).length === 1; }, 4000); await sleep(200);
    check('the card carries the step (myweek[])', (item('w1').myweek || []).length === 1 && item('w1').myweek[0].itemId === 's1' && item('w1').myweek[0].title === 'Run the gel');
    check('…and its ✓ is filled and names the step', btn('w1').classList.contains('wb-report-on') && btn('w1').getAttribute('aria-pressed') === 'true' && /Run the gel/.test(btn('w1').title));

    /* ── report the same card to a step that already has a result → appended, not replaced ── */
    await tap(btn('w1'));
    await until(function () { return rows().length > 0; }, 4000);
    check('the step already linked to this card is greyed out', !!rowOf('s1') && rowOf('s1').disabled && /already linked to this card/.test(rowOf('s1').textContent));
    click(rowOf('s4'));
    await until(function () { return window.__dd.saves.length === 2; }, 4000);
    var L2 = window.__dd.saves[1].payload.links || [];
    check('an existing result keeps its links and gains this card', window.__dd.saves[1].id === 's4' && L2.length === 2 && L2[0].itemId === 'zz' && L2[1].itemId === 'w1' && window.__dd.saves[1].payload.summary === 'good spreading');
    check('toast: added to its result', /added to its result/.test(window.__toastOk[1] || ''), window.__toastOk[1]);
    await until(function () { return (item('w1').myweek || []).length === 2; }, 4000);
    check('the card now names two steps', (item('w1').myweek || []).length === 2);

    /* ── a region reports too ── */
    await tap(btn('r1'));
    await until(function () { return rows().length > 0; }, 4000);
    check('the region’s ✓ opens the picker naming the region', !!pop() && q('.mwr-pop .mwr-ctitle').textContent === 'Prep');
    click(rowOf('s2'));
    await until(function () { return window.__dd.saves.length === 3; }, 4000);
    var L3 = window.__dd.saves[2].payload.links || [];
    check('a region becomes a result link of kind region', L3.length === 1 && L3[0].itemId === 'r1' && L3[0].item_kind === 'region' && L3[0].title === 'Prep');
    await until(function () { return (item('r1').myweek || []).length === 1; }, 4000); await sleep(150);
    check('the region’s ✓ fills', btn('r1') && btn('r1').classList.contains('wb-report-on'));

    if (!MOBILE) {
      /* ── the ⋯ menu offers it too ── */
      click(card('w2').querySelector('[data-wb-wmenu]')); await sleep(120);
      var mrow = qa('.cw-pop .cw-row').filter(function (r) { return /Report as a My Week result/.test(r.textContent); })[0];
      check('the card menu has "Report as a My Week result…"', !!mrow);
      if (mrow) { click(mrow); await sleep(150); }
      check('…which opens the same picker for that card', !!pop() && q('.mwr-pop .mwr-ctitle').textContent === 'To do');
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await sleep(60);
      check('Escape closes it', !pop());
    }

    /* V3.884 — "this won't go away": it always has a ×, and a click into a frame (Scientia in the Lab Notebook) closes it */
    MYWEEK_REPORT.open({ card: { itemId: 'w2', title: 'To do', kind: 'notebook_item' }, point: { x: 40, y: 40 } }); await until(function () { return pop(); }, 2000); await sleep(30);
    check('the picker has a × …', !!q('.mwr-pop [data-mwr-close]'));
    click(q('.mwr-pop [data-mwr-close]')); await sleep(40);
    check('…that closes it', !pop());
    var ifr = document.createElement('iframe'); ifr.style.cssText = 'width:120px;height:60px'; ifr.srcdoc = '<button>in the frame</button>'; document.body.appendChild(ifr);
    await sleep(150);
    MYWEEK_REPORT.open({ card: { itemId: 'w2', title: 'To do', kind: 'notebook_item' }, point: { x: 40, y: 40 } }); await until(function () { return pop(); }, 2000); await sleep(30);
    ifr.contentDocument.querySelector('button').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 5 }));
    await sleep(60);
    check('a click inside a frame on the page (Scientia in the Lab Notebook) closes it — the page itself never hears that click', !pop());
    ifr.remove();

    check('no browser popups', window.__popups.length === 0);
    check('no toast errors', (window.__toastErr || []).length === 0, window.__toastErr);
    check('no raw SVG markup leaked into text', document.body.innerText.indexOf('<svg') < 0);
  } catch (e) { check('the harness itself threw: ' + (e && e.message), false, String(e && e.stack || '').split('\n').slice(0, 4).join(' | ')); }
  finish();
})();
</script>
