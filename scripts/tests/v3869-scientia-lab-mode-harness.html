  /* V3.875 — a stand-in for the Lab Notebook host: records the frame's RM requests; in mode 'ok' it answers like notebook-scientia.js */

        var hit = all.filter(function (x) { var H = (x.name + ' ' + x.vendor + ' ' + x.catalogue_number + ' ' + x.category).toLowerCase(); return qq.split(/\s+/).filter(Boolean).every(function (w) { return H.indexOf(w) >= 0; }); });
        res = { ok: true, total: hit.length, items: hit };

      return Promise.resolve(new Response(JSON.stringify(res), { status: 200, headers: { 'Content-Type': 'application/json' } }));
    };
  }).toString() + ')(' + JSON.stringify(STATE) + ');<\/script>';

  try {

    function diag() {

        o.stores = w.eval('typeof STORES'); o.syncMeta = w.localStorage.getItem('sis:sync'); o.tabs = d.querySelectorAll('#tabs a.tab').length; o.body = (d.body.innerText || '').slice(0, 300); o.url = d.URL; } catch (e) { o.err = String(e); }

    check('✦ Tools puts the pills back', !Object.keys(JSON.parse(W.localStorage.getItem('sis:lab:pills') || '{}')).length && !pill('view').style.left);
    pill('view').querySelector('.lab-pill-btn').click(); await until(function () { return pill('view').classList.contains('open'); }, 2000);
    q('#ttl') && q('#ttl').dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true, pointerId: 12 }));
    D.body.dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true, pointerId: 13 }));
    check('a tap outside closes the fan', !!(await until(function () { return !q('.lab-pill.open'); }, 2000)));
    check('no browser popups, rejections or console-level failures in the frame', !W.__popups.length && !W.__rej.length, JSON.stringify([W.__popups, W.__rej]));
  } catch (e) { check('harness error', false, (e && e.stack) || e); }
  finish();
})();
