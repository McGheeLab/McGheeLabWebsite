    function cpe(el, type, x, y, o) { el.dispatchEvent(new PointerEvent(type, Object.assign({ bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: pid, pointerType: 'mouse', pressure: 0.5, button: 0, buttons: type === 'pointerup' ? 0 : 1, isPrimary: true }, o || {}))); }
    async function cardTap(el, x, y, o) { pid++; cpe(el, 'pointerdown', x, y, o); await sleep(30); cpe(el, 'pointerup', x, y, o); await sleep(80); }
    async function cardDrag(el, x, y, dx, dy, o) { pid++; cpe(el, 'pointerdown', x, y, o); for (var i = 1; i <= 6; i++) { await sleep(16); cpe(el, 'pointermove', x + dx * i / 6, y + dy * i / 6, o); } cpe(el, 'pointerup', x + dx, y + dy, o); await sleep(150); }
    function inCard(id) { var a = document.activeElement; return !!(a && cardNode(id) && cardNode(id).contains(a)); }
    check('the Text mode is gone (no text tool, no text options)', !q('.wb-fan-item[data-wb-act="hand-text"]') && !q('.wb-fan-item[data-wb-act="text-size"]'));
    await openPill('zoom'); click(q('.wb-fan-item[data-wb-act="zoom-home"]')); await sleep(120); await closePills();
    await openPill('pens'); click(q('.wb-fan-item[data-wb-act="hand-card"]')); await sleep(150);
    var ca = fanActs('pens').slice(5);
    check('Cards: the fan stays open; with no card chosen its second arc is ＋ a note card · fit everything; the cursor is an arrow', mode() === 'card' && !!q('.wb-pill.wb-open') && ca.join() === 'card-note,zoom-fit' && cursor() === 'default' && pill('pens').classList.contains('wb-pill-on'), ca.join(' · ') + ' ' + cursor());
    await closePills();
    var cn = cardNode('n1'), body = cn.querySelector('.wb-wb');
    check('a card\'s body is inert in Cards until it is chosen (a drag never selects text or presses a button)', getComputedStyle(body).pointerEvents === 'none' && getComputedStyle(cn).cursor === 'grab', getComputedStyle(body).pointerEvents);
    var br = body.getBoundingClientRect(), bx = br.left + br.width / 2, by = br.top + Math.min(br.height / 2, 14);
    var x0 = itemOf('n1').x, y0 = itemOf('n1').y;
    await cardDrag(cn, bx, by, -90, 60);
    var moved1 = await until(function () { var it = itemOf('n1'); return it.x !== x0 || it.y !== y0; }, 2000);
    check('a drag from ANYWHERE on a card (its body too) moves it, and does not choose it', !!moved1 && !h().selectedCard(), JSON.stringify([x0, y0, itemOf('n1').x, itemOf('n1').y]));
    await sleep(200);
    cn = cardNode('n1'); var ed = cn.querySelector('.nbk-note'); var er = ed.getBoundingClientRect();
    await cardTap(cn, er.left + 8, er.top + er.height / 2);
    check('a mouse tap CHOOSES the card (outlined, its body alive) and puts the caret where it clicked', h().selectedCard() === 'n1' && cn.classList.contains('wb-card-sel') && getComputedStyle(cn.querySelector('.wb-wb')).pointerEvents !== 'none' && document.activeElement === ed, (document.activeElement || {}).className);
    await openPill('pens');
    var sa = fanActs('pens').slice(5);
    check('with a card chosen the second arc is its options: edit · colour · collapse · front · more · remove · done', sa.join() === 'card-edit,card-color,card-collapse,card-front,card-more,card-remove,card-done', sa.join(' · '));
    await closePills();
    var x1 = itemOf('n1').x; pid++; cpe(ed, 'pointerdown', er.left + 10, er.top + 6); cpe(ed, 'pointermove', er.left + 60, er.top + 30); cpe(ed, 'pointerup', er.left + 60, er.top + 30); await sleep(200);
    check('inside the chosen card a press is the card\'s own (selecting text does not drag the card)', itemOf('n1').x === x1 && h().selectedCard() === 'n1');
    await tap(0.15, 0.85); await sleep(120);
    check('a tap on the empty board lets the card go (and the caret leaves it)', !h().selectedCard() && !cardNode('n1').classList.contains('wb-card-sel') && !inCard('n1'), (document.activeElement || {}).tagName);
    cn = cardNode('n1'); er = cn.querySelector('.nbk-note').getBoundingClientRect();
    await cardTap(cn, er.left + 8, er.top + er.height / 2, { pointerType: 'touch' });
    check('a FINGER tap only chooses the card — no caret, so no on-screen keyboard on the way to a card', h().selectedCard() === 'n1' && !inCard('n1'), (document.activeElement || {}).tagName);
    var tt = cn.querySelector('.wb-wtitle'), tr = tt.getBoundingClientRect();
    await cardTap(tt, tr.left + 6, tr.top + tr.height / 2, { pointerType: 'touch' });
    check('a second tap on the chosen card\'s name edits it (the keyboard comes up because you are typing)', document.activeElement === tt && h().selectedCard() === 'n1');
    tt.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await sleep(60);
    check('Escape lets the chosen card go', !h().selectedCard() && !inCard('n1'));
    function notes() { return h().getItems().filter(function (i) { return i.type === 'widget' && i.kind === 'note' && i.id !== 'n1'; }); }
    await openPill('pens'); click(q('.wb-fan-item[data-wb-act="card-note"]'));
    var nn = await until(function () { return notes().length === 1 && h().selectedCard() === notes()[0].id; }, 2500); await sleep(200);
    check('＋ a note card: one appears mid-view, chosen, with the caret in it', !!nn && inCard(notes()[0].id) && document.activeElement.isContentEditable, notes().length + ' ' + h().selectedCard());
    await openPill('pens'); var rm = q('.wb-fan-item[data-wb-act="card-remove"]'); click(rm); await sleep(60);
    var stillThere = notes().length === 1 && !!q('.wb-pill.wb-open');
    click(q('.wb-fan-item[data-wb-act="card-remove"]')); await until(function () { return notes().length === 0; }, 2500); await sleep(120);
    check('🗑 Remove takes two taps (the first only arms it), then the card is gone and the arc is back to ＋ / fit', stillThere && notes().length === 0 && !h().selectedCard() && fanActs('pens').slice(5).join() === 'card-note,zoom-fit', fanActs('pens').slice(5).join(' · '));
    await closePills();
    cn = cardNode('n1'); er = cn.querySelector('.wb-wb').getBoundingClientRect(); await cardTap(cn, er.left + 8, er.top + 8);
    h().setHandMode('pen'); await sleep(80);
    check('leaving Cards lets the chosen card go; in pen mode the card\'s body is live again (editing in place still works)', !h().selectedCard() && !cardNode('n1').classList.contains('wb-card-sel') && getComputedStyle(cardNode('n1').querySelector('.wb-wb')).pointerEvents !== 'none');
    h().setHandMode('card'); await sleep(60);
    var o2 = h().getOrigin(); await drag(0.2, 0.8, -100, -40); var o3 = h().getOrigin();
    check('in Cards a drag on the empty board moves around (draws nothing)', (o2.x !== o3.x || o2.y !== o3.y) && strokes() === 3, JSON.stringify([o2, o3]) + ' strokes=' + strokes());
    await dbl(0.2, 0.8); await sleep(200);
    check('a double tap on the empty board in Cards goes back to the last mode', mode() === 'pen', mode());

    /* ── the eraser is a pen option the double tap remembers too ── */
    h().setHandMode('eraser'); await sleep(40); h().setHandMode('pan'); await sleep(40);
    h().toggleLastMode(); await sleep(60);
    check('eraser → pan → double tap: back to the eraser, and the first arc lights Pen', mode() === 'eraser', mode());
    await dbl(0.9, 0.9); await sleep(200);
    check('a mouse double-click in eraser mode is not a switch (it would have erased)', mode() === 'eraser', mode());
    h().setHandMode('hl'); await sleep(40); h().setHandMode('pen'); await sleep(40);
    var pen = h().currentPen();
    check('Highlighter → Pen: a real pen is in hand again (not the highlighter or the eraser)', mode() === 'pen' && pen && pen.id === 'pen1' && !pen.hl, JSON.stringify(pen));
    check('the canvas never shows a browser popup; no unhandled rejections', window.__popups.length === 0 && window.__rej.length === 0, window.__rej.join(' | '));
  } catch (e) { check('the harness itself threw: ' + (e && e.message), false, String(e && e.stack || '').split('\n').slice(0, 4).join(' | ')); }
  finish();
})();
</script>
