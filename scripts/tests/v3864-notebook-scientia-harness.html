    var up = await until(function () { return window.__hubCalls.filter(function (c) { return c.path === 'api/snapshot'; })[0]; });
    var sent = up ? JSON.parse(up.body) : {};
    check('Replace posts the export to the hub without journal / blobs', !!up && up.method === 'POST' && !sent.stores.journal && !sent.stores.blobs && sent.stores.documents.length === 2, up && Object.keys(sent.stores).join(','));
    check('afterwards the confirm closes and Scientia reloads from the cloud', !!(await until(function () { return !q('.nbc-sis-confirm') && q('#nbc-sis-frame').getAttribute('src') === '/rm/scientia/scientia.html'; })), srcBefore + ' -> ' + q('#nbc-sis-frame').getAttribute('src'));
    /* 6b. V3.876 — the host side of Scientia's Phase 2 bridge (notebook-scientia.js answering its frame) */
    var hf = q('#nbc-sis-frame');
    await until(function () { try { return hf.contentDocument && hf.contentDocument.readyState === 'complete'; } catch (e) { return false; } }, 15000);
    var hw = hf.contentWindow;
    hw.eval("window.__acks = []; window.addEventListener('message', function (e) { if (e.data && e.data.sisCmd && /^rm-/.test(e.data.sisCmd)) window.__acks.push(e.data); }); window.parent.postMessage({ sis: true, type: 'ready', hash: location.hash }, location.origin);");
    window.MYWEEK_REPORT = { open: function (o) { window.__mwrOpen = o; setTimeout(function () { o.onReported({ id: 'st-9', title: 'Gel stiffness run', date: '2026-10-26' }, {}); }, 30); } };
    hw.eval("window.parent.postMessage({ sis: true, type: 'rm-read', reqId: 'h1', paper: { paperId: 'p-host', title: 'A host paper', cite: 'Smith 2024', journal: 'Soft Matter', pdf: true }, focus: 'ann-x' }, location.origin);");
    var rdr = await until(function () { return q('.cpr-reader'); }, 6000);
    check('rm-read: the notebook opens RM\'s paper reader over itself for Scientia', !!rdr && /A host paper/.test(rdr.textContent), rdr ? rdr.textContent.slice(0, 80) : 'no reader');
    var ack1 = await until(function () { return hw.__acks.filter(function (m) { return m.sisCmd === 'rm-ack' && m.reqId === 'h1'; })[0]; }, 4000);
    check('…and answers rm-ack ok:true', !!ack1 && ack1.ok === true, JSON.stringify(hw.__acks));
    var clb = rdr && rdr.querySelector('[data-cpr="close"]'); if (clb) clb.click();
    check('closing the reader tells Scientia (rm-reader-closed) so its paper cards refresh', !!(await until(function () { return hw.__acks.filter(function (m) { return m.sisCmd === 'rm-reader-closed' && m.paperId === 'p-host'; })[0]; }, 4000)));
    hw.eval("window.parent.postMessage({ sis: true, type: 'rm-report', reqId: 'h2', card: { kind: 'scientia_block', itemId: 'c1', boardId: '', entryId: 'd1', title: 'A component', url: '/rm/pages/notebook.html?notebook=scientia&note=d1' }, point: { x: 40, y: 50 } }, location.origin);");
    var gotRep = await until(function () { return hw.__acks.filter(function (m) { return m.sisCmd === 'rm-reported' && m.reqId === 'h2'; })[0]; }, 4000);
    var hfr = hf.getBoundingClientRect();
    check('rm-report: My Week\'s report picker opens with the card, at the click translated into the notebook', !!window.__mwrOpen && window.__mwrOpen.card.itemId === 'c1' && !!window.__mwrOpen.point && Math.round(window.__mwrOpen.point.x) === Math.round(hfr.left + 40) && Math.round(window.__mwrOpen.point.y) === Math.round(hfr.top + 50), JSON.stringify(window.__mwrOpen && { card: window.__mwrOpen.card.itemId, point: window.__mwrOpen.point }));
    check('…and the chosen step goes back to Scientia (rm-reported)', !!gotRep && gotRep.step.id === 'st-9' && gotRep.step.title === 'Gel stiffness run' && gotRep.blockId === 'c1', JSON.stringify(gotRep));
    delete window.MYWEEK_REPORT;
    hw.eval("window.parent.postMessage({ sis: true, type: 'rm-report', reqId: 'h3', card: { kind: 'scientia_block', itemId: 'c2' } }, location.origin);");
    var ack3 = await until(function () { return hw.__acks.filter(function (m) { return m.sisCmd === 'rm-ack' && m.reqId === 'h3'; })[0]; }, 4000);
    check('without My Week\'s picker on the page the host answers ok:false (Scientia then shows a hint)', !!ack3 && ack3.ok === false, JSON.stringify(ack3));
    /* 6c. V3.878 — Something I did: the host lists your actions with RM's own code and marks the picked one noted */
    var UA0 = window.USER_ACTIONS;
    window.USER_ACTIONS = { list: function () { return Promise.resolve([{ id: 'inv_u1', kind: 'inventory_use', at: '2026-10-26T10:15:00', itemName: 'PBS', qty: 2, unit: 'mL', itemId: 'inv-pbs', note: 'wash' }, { id: 'old', kind: 'inventory_use', status: 'ignored' }]); },
      pending: function (all) { return all.filter(function (a) { return a.status !== 'ignored'; }); }, describe: function (a) { return 'Used ' + a.qty + ' ' + a.unit + ' of ' + a.itemName; },
      markNoted: function (id, where) { window.__noted = [id, where]; return Promise.resolve(); } };
    hw.eval("window.parent.postMessage({ sis: true, type: 'rm-actions', reqId: 'h4' }, location.origin);");
    var lst = await until(function () { return hw.__acks.filter(function (m) { return m.sisCmd === 'rm-actions-list' && m.reqId === 'h4'; })[0]; }, 4000);
    check('rm-actions: the host lists your pending actions, described by RM', !!lst && lst.ok && lst.rows.length === 1 && lst.rows[0].text === 'Used 2 mL of PBS' && lst.rows[0].itemId === 'inv-pbs' && lst.rows[0].note === 'wash', JSON.stringify(lst));
    hw.eval("window.parent.postMessage({ sis: true, type: 'rm-action-noted', reqId: 'h5', actionId: 'inv_u1', entryId: 'd1', cardId: 'c9' }, location.origin);");
    check('rm-action-noted: the host marks it noted in that Scientia note (USER_ACTIONS.markNoted)', !!(await until(function () { return window.__noted && window.__noted[0] === 'inv_u1' && window.__noted[1].entryId === 'scientia:d1' && window.__noted[1].cardId === 'c9'; }, 4000)), JSON.stringify(window.__noted));
    window.USER_ACTIONS = UA0;
    /* 7. back to the canvas */
    q('#nbc-tabs [data-t="entry"][data-id="nb-m"]').click();
    await until(function () { return q('#nbb-mount .wb-stage') && !root().classList.contains('nbc-sis-on'); });
    check('a canvas tab brings the canvas back and hides Scientia', !root().classList.contains('nbc-sis-on') && !!q('#nbb-mount .wb-stage') && getComputedStyle(q('#nbc-sis')).display === 'none');
    check('the header is the entry\'s again', !!q('#nbc-title') && q('#nbc-title').value === 'Canvas entry');
    check('Scientia stays loaded in the background (sync keeps running)', !!q('#nbc-sis-frame'));
    check('the choice is remembered as canvas', localStorage.getItem('nbc_view') === 'canvas');
    check('no browser popups, rejections or error toasts', !window.__popups.length && !window.__rej.length && !(window.__toastErr || []).length, JSON.stringify([window.__popups, window.__rej, window.__toastErr]));
    check('no raw "<svg" text leaked into the page', document.body.innerText.indexOf('<svg') < 0);
  } catch (e) { check('harness ran without throwing', false, e && e.stack); }
  finish();
})();
