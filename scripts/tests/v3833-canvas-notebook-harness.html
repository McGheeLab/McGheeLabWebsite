(function () {
  var store = new Map(), listeners = [], touched = [];
  function snapOf(path) { return { id: path.split('/').pop(), exists: store.has(path), data: function () { return store.has(path) ? JSON.parse(JSON.stringify(store.get(path))) : undefined; }, ref: docRef(path) }; }
  function docsIn(path) { var out = []; store.forEach(function (v, k) { if (k.slice(0, k.lastIndexOf('/')) === path) out.push(snapOf(k)); }); return out; }
  function fire(path, type) {
    var parent = path.slice(0, path.lastIndexOf('/'));
    listeners.slice().forEach(function (l) {
      if (l.kind === 'doc' && l.path === path) l.cb(snapOf(path));
      if (l.kind === 'col' && l.path === parent) l.cb({ docChanges: function () { return [{ type: type, doc: snapOf(path) }]; }, docs: docsIn(parent), size: 1, empty: false, forEach: function (f) { docsIn(parent).forEach(f); } });

  function docRef(path) {
    return {
      path: path, id: path.split('/').pop(),
      collection: function (n) { return colRef(path + '/' + n); },
      get: function () { touched.push('get ' + path); return Promise.resolve(snapOf(path)); },
      set: function (d, o) { touched.push('set ' + path); var existed = store.has(path); store.set(path, (o && o.merge) ? Object.assign({}, store.get(path) || {}, JSON.parse(JSON.stringify(d))) : JSON.parse(JSON.stringify(d))); fire(path, existed ? 'modified' : 'added'); return Promise.resolve(); },
      update: function (d) { touched.push('update ' + path); applyUpdate(path, d); return Promise.resolve(); },
      delete: function () { touched.push('delete ' + path); store.delete(path); fire(path, 'removed'); return Promise.resolve(); },
      onSnapshot: function (cb) { touched.push('listen ' + path); var l = { path: path, kind: 'doc', cb: cb }; listeners.push(l); setTimeout(function () { cb(snapOf(path)); }, 0); return function () { var i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; }
    };
  }
  function colRef(path) {
    var q = { path: path,
      doc: function (id) { return docRef(path + '/' + (id || ('auto' + Math.random().toString(36).slice(2, 8)))); },
      orderBy: function () { return q; }, where: function () { return q; }, limit: function () { return q; },
      get: function () { var d = docsIn(path); return Promise.resolve({ docs: d, size: d.length, empty: !d.length, forEach: function (f) { d.forEach(f); } }); },
      onSnapshot: function (cb) { touched.push('listen ' + path); var l = { path: path, kind: 'col', cb: cb }; listeners.push(l); var d = docsIn(path); setTimeout(function () { cb({ docChanges: function () { return d.map(function (s) { return { type: 'added', doc: s }; }); }, docs: d, size: d.length, empty: !d.length, forEach: function (f) { d.forEach(f); } }); }, 0); return function () { var i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; }

  }

    collection: function (n) { return colRef(n); },
    batch: function () { var ops = []; return { set: function (ref, d, o) { ops.push(function () { return ref.set(d, o); }); }, update: function (ref, d) { ops.push(function () { return ref.update(d); }); }, delete: function (ref) { ops.push(function () { return ref.delete(); }); }, commit: function () { return ops.reduce(function (p, f) { return p.then(f); }, Promise.resolve()); } }; },
    runTransaction: function (fn) { var tx = { get: function (ref) { return ref.get(); }, set: function (ref, d, o) { ref.set(d, o); }, update: function (ref, d) { ref.update(d); } }; return Promise.resolve(fn(tx)); }
  };

    storage: function () { return { ref: function () { return { child: function (p) { return { put: function () { touched.push('put ' + p); return Promise.resolve(); }, getDownloadURL: function () { return Promise.resolve('https://storage.example/' + p); }, delete: function () { touched.push('rm ' + p); return Promise.resolve(); } }; } }; } }; },

  window.TOAST = { info: function () {}, success: function () {}, error: function (m) { (window.__toastErr = window.__toastErr || []).push(m); } };
  window.NOTEBOOK_FIGURES = { uploadImage: function () { return Promise.resolve({ download_url: 'https://firebasestorage.googleapis.com/x/y.webp', storage_path: 'notebook-figures/u1/y.webp', hash: 'h', mime: 'image/webp', size_bytes: 10, uploaded_at: 'now', uploaded_by: 'u1' }); } };

             { id: 'blk-b', type: 'checklist', title: '', collapsed: false, data: { items: [{ text: 'image at 24 h', done: false }] } },

  store.set('userData/u1/notebookBoards/nbOLD_u1', { name: 'Sketch', pages: [{ id: 'p1', background: 'blank' }], activePageId: 'p1', ownerUid: 'u1' });
  store.set('items/pa', { type: 'paper', title: 'Collagen fibril alignment under shear flow', meta: { library: { is_library_entry: true, authors: [{ family: 'Smith' }, { family: 'Lee' }, { family: 'Wu' }], year: 2020, journal: 'Biophys J' } } });

  if (window.PointerEvent && !PointerEvent.prototype.getCoalescedEvents) PointerEvent.prototype.getCoalescedEvents = function () { return [this]; };

<p>Serve the repo root and open <code>/scripts/tests/v3833-canvas-notebook-harness.html</code>. Real <code>whiteboard.js</code>, <code>canvas-widgets.js</code> and <code>notebook-canvas.js</code> against a stub Firestore / firebridge / api. Result: <code>#r[data-done=1]</code>.</p>

<script>
(function () {
  var out = [], pass = 0, fail = 0;
  function ok(c, m, got) { if (c) pass++; else fail++; out.push('<div class="' + (c ? 'ok' : 'bad') + '">' + (c ? '✓' : '✗') + ' ' + m + (got !== undefined ? '  →  <code>' + String(got).replace(/</g, '&lt;') + '</code>' : '') + '</div>'); }
  function done() { var r = document.getElementById('r'); r.innerHTML = '<b>' + pass + ' passed, ' + fail + ' failed</b>' + out.join(''); r.dataset.done = '1'; r.dataset.pass = pass; r.dataset.fail = fail; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function until(fn, ms) { ms = ms || 5000; var t0 = Date.now(); return new Promise(function (res, rej) { (function poll() { var v; try { v = fn(); } catch (e) {} if (v) return res(v); if (Date.now() - t0 > ms) return rej(new Error('timeout: ' + fn.toString().slice(0, 80))); setTimeout(poll, 40); })(); }); }
  var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var store = window.__stub.store, touched = window.__stub.touched;
  var S = function () { return window.NOTEBOOK_CANVAS._state; };
  var itemsOf = function (bid) { var o = []; store.forEach(function (v, k) { if (k.indexOf('userData/u1/notebookBoards/' + bid + '/items/') === 0) o.push(Object.assign({ id: k.split('/').pop() }, v)); }); return o; };

  (async function () {
    try {
      /* ── boot: the default notebook, the rail, the old entry opens and MIGRATES ── */
      await until(function () { return q('#nbc-tabs .nbc-group'); });
      ok(store.has('userData/u1/notebooks/default'), 'boot creates the default notebook doc');
      ok(qa('#nbc-tabs .nbc-group').length === 1 && /My notebook/.test(q('#nbc-tabs .nbc-gname').textContent), 'the tab strip shows one group: My notebook');
      await until(function () { return S().inst && S().doc && S().doc.id === 'nb-2026-10-20-old'; });
      ok(S().doc.boardId === 'nbOLD_u1', 'the V3.830 whiteboard block\'s board becomes the entry\'s board (ink carries over)', S().doc.boardId);
      await until(function () { return itemsOf('nbOLD_u1').filter(function (i) { return i.type === 'widget'; }).length >= 2; }, 6000);
      var mig = itemsOf('nbOLD_u1');
      var kinds = mig.map(function (i) { return i.kind; }).sort().join(',');
      ok(kinds === 'checklist,note', 'blocks became widget items (note + checklist; the adopted whiteboard block is not duplicated)', kinds);
      var noteW = mig.find(function (i) { return i.kind === 'note'; });
      ok(noteW && noteW.title === 'Setup' && /MCF10A/.test(noteW.data.html) && noteW.pageId === 'p1', 'the note widget carries title + html onto page p1');
      await until(function () { return qa('.wb-item-widget').length === 2; });
      ok(!!q('.wb-widgets .wb-item-widget[data-kind="note"] .nbk-note'), 'the host renders the note body inside the engine\'s card (above the ink layer)');
      ok(q('.wb-item-widget[data-kind="note"] .wb-wkind').textContent.indexOf('Typed note') >= 0 && q('.wb-item-widget[data-kind="note"] .wb-wtitle').value === 'Setup', 'card chrome: kind label from the registry + title input');
      await until(function () { var d = store.get('userData/u1/notebook/nb-2026-10-20-old'); return d && d.canvas_version === 3; }, 6000);
      var ent = store.get('userData/u1/notebook/nb-2026-10-20-old');
      ok(ent.canvas_version === 3 && ent.boardId === 'nbOLD_u1', 'entry doc saved with canvas_version 3 + boardId');
      await until(function () { var d = store.get('userData/u1/notebook/nb-2026-10-20-old'); return d && Array.isArray(d.blocks) && d.blocks.length === 2 && /MCF10A/.test(d.body_html || ''); }, 6000);
      ent = store.get('userData/u1/notebook/nb-2026-10-20-old');
      ok(ent.blocks.length === 2 && ent.blocks[0].type === 'note' && /Setup/.test(ent.body_html) && /image at 24 h/.test(ent.body_text), 'mirrors recomputed from the widgets: blocks[] (ordered by position), body_html, body_text', ent.body_text.slice(0, 60));
      var idx = store.get('userData/u1/notebook/_index').entries.find(function (r) { return r.id === 'nb-2026-10-20-old'; });
      ok(idx && idx.canvas_version === 3 && idx.notebook_id === 'default' && idx.board_id === 'nbOLD_u1', 'index row carries canvas_version / notebook_id / board_id');
      ok(S().inst.getCollection() === 'notebookBoards' && !q('.wb-toolbar:not([hidden])') && !q('.wb-topbar'), 'no linear toolbar and no topbar: the sheet is the view');
      ok(['widgets', 'tools', 'pens', 'zoom'].every(function (n) { return q('.wb-pill[data-pill="' + n + '"] .wb-pill-btn'); }), 'four pills: widgets · tools · pens · zoom');
      ok(q('.nbc-tab-on') && /Old block entry/.test(q('.nbc-tab-on').textContent), 'the open entry is the active tab', q('.nbc-tab-on') && q('.nbc-tab-on').textContent);
      /* pens pill fans out: 4 colours, 3 widths, eraser, undo, clear */
      q('.wb-pill[data-pill="pens"] .wb-pill-btn').click();
      await until(function () { return q('.wb-pill-pens.wb-open .wb-fan-item'); });
      ok(qa('.wb-pill-pens .wb-fan-item[data-wb-act="pen-pick"]').length === 5 && qa('.wb-pill-pens .wb-fan-item[data-wb-act^="hand-"]').length === 5 && qa('.wb-pill-pens .wb-fan-item[data-wb-act="width"]').length === 3 && q('.wb-pill-pens .wb-fan-item[data-pen="er1"] .wb-fan-eraser') && q('.wb-pill-pens .wb-fan-item[data-wb-act="undo"]') && q('.wb-pill-pens .wb-fan-item[data-wb-act="clear-page"]'), 'pens pill: colours · widths · eraser · undo · clear', qa('.wb-pill-pens .wb-fan-item').length);
      var fanned = qa('.wb-pill-pens .wb-fan-item').map(function (b) { return b.style.getPropertyValue('--tx') + '/' + b.style.getPropertyValue('--ty'); });
      ok(new Set(fanned).size === fanned.length && fanned.every(function (v) { return /px\/-?\d+px/.test(v); }), 'every fan item has its own arc position', fanned.slice(0, 3).join(' '));
      q('.wb-pill-pens .wb-fan-item[data-pen="er1"]').click();
      await wait(30);
      ok(S().inst.getTool() === 'eraser' && !q('.wb-pill-pens.wb-open'), 'picking the eraser of the set sets the tool and folds the fan');
      q('.wb-pill[data-pill="pens"] .wb-pill-btn').click(); await until(function () { return q('.wb-pill-pens.wb-open .wb-fan-item[data-pen="pen1"]'); }); q('.wb-pill-pens .wb-fan-item[data-pen="pen1"]').click(); await wait(20);   /* V3.860 — the ✎ fan opens a beat later */
      ok(S().inst.getTool() === 'pen', 'a pen again → back to the pen');
      /* zoom pill: + home − fit-region pan zoom */
      q('.wb-pill[data-pill="zoom"] .wb-pill-btn').click();
      await until(function () { return q('.wb-pill-zoom.wb-open .wb-fan-item'); });
      ok(['zoom-in', 'zoom-home', 'zoom-out', 'fit-region'].every(function (a) { return q('.wb-pill-zoom .wb-fan-item[data-wb-act="' + a + '"]'); }) && !q('.wb-pill-zoom .wb-fan-item[data-wb-act="pan"]'), 'zoom pill: + · home · − · fit a region (V3.860: pan and zoom are modes of the ✎ pill)');
      q('.wb-pill-zoom .wb-fan-item[data-wb-act="zoom-in"]').click(); await wait(30);
      ok(q('.wb-pill-zoom.wb-open') && Math.abs(S().inst.getView().scale - 1.25) < 1e-6 && /125%/.test(q('.wb-pill-zoom [data-wb-zoom-pct]').textContent), 'zoom in keeps the fan open and the pill shows 125%', q('.wb-pill-zoom [data-wb-zoom-pct]').textContent);
      q('.wb-pill-zoom .wb-fan-item[data-wb-act="zoom-home"]').click(); await until(function () { return S().inst.getView().scale === 1; }, 2000);
      q('.wb-pill[data-pill="pens"] .wb-pill-btn').click(); await until(function () { return q('.wb-pill-pens.wb-open .wb-fan-item[data-wb-act="hand-pan"]'); });
      q('.wb-pill-pens .wb-fan-item[data-wb-act="hand-pan"]').click(); await wait(30);
      ok(S().inst.getTool() === 'pan' && q('.wb-pill-pens.wb-pill-on') && S().inst.getView().scale === 1, 'home → 100 %; ✋ pan (a mode of the ✎ pill) is on and the ✎ pill shows it');
      S().inst.toggleLastMode(); await wait(30);
      ok(S().inst.getTool() === 'pen', 'the last mode (a double tap) → back to the pen');
      /* tools pill: record · arrange · tidy · host tools · full screen */
      q('.wb-pill[data-pill="tools"] .wb-pill-btn').click();
      await until(function () { return q('.wb-pill-tools.wb-open .wb-fan-item'); });
      ok(q('.wb-pill-tools .wb-fan-item[data-wb-act="rec"]') && q('.wb-pill-tools .wb-fan-item[data-wb-act="arrange"]') && q('.wb-pill-tools .wb-fan-item[data-wb-act="tidy"]') && q('.wb-pill-tools .wb-fan-item[data-tool="paper"]') && q('.wb-pill-tools .wb-fan-item[data-tool="recs"]') && q('.wb-pill-tools .wb-fan-item[data-tool="max"]'), 'tools pill: 🎙 · ⤧ · ⇣ · From paper · Recordings · ⛶');
      q('.wb-pill-tools .wb-fan-item[data-tool="max"]').click(); await wait(40);
      ok(document.body.classList.contains('nbc-full') && S().full, '⛶ makes the sheet the whole screen (body.nbc-full)');
      q('[data-h="full"]') && q('[data-h="full"]').click(); await wait(30);
      if (document.body.classList.contains('nbc-full')) { S().full = true; }
      document.body.classList.remove('nbc-full'); S().full = false;

      /* ── collapse / expand through the chrome ── */
      var card = q('.wb-item-widget[data-kind="note"]');
      card.querySelector('[data-wb-wcollapse]').click();
      await until(function () { var it = itemsOf('nbOLD_u1').find(function (i) { return i.kind === 'note'; }); return it && it.collapsed === true; });
      await wait(30);
      card = q('.wb-item-widget[data-kind="note"]');
      ok(card.classList.contains('wb-collapsed') && card.querySelector('.wb-wb').hidden && card.querySelector('.wb-wsum').textContent.indexOf('Seeded') === 0, 'chevron collapses the card: body hidden, summary line shown', card.querySelector('.wb-wsum').textContent);
      card.querySelector('[data-wb-wcollapse]').click();
      await until(function () { var it = itemsOf('nbOLD_u1').find(function (i) { return i.kind === 'note'; }); return it && it.collapsed === false; });
      await wait(30);
      ok(!q('.wb-item-widget[data-kind="note"]').classList.contains('wb-collapsed'), 'and expands again');

      /* ── incremental render: typing survives a redraw; a local save never rebuilds the body ── */
      var ed = q('.wb-item-widget[data-kind="note"] .nbk-note');
      ed.focus();
      ed.innerHTML = '<p>Seeded <b>MCF10A</b> on gels. Confluent by day 2.</p>';
      ed.dispatchEvent(new Event('input', { bubbles: true }));
      S().inst.zoomBy(1.25);
      await wait(60);
      S().inst.zoomFit();
      await wait(60);
      ok(q('.wb-item-widget[data-kind="note"] .nbk-note') === ed && document.activeElement === ed, 'the editor node survives zoom redraws and keeps focus');
      await until(function () { var it = itemsOf('nbOLD_u1').find(function (i) { return i.kind === 'note'; }); return it && /day 2/.test(it.data.html); }, 3000);
      await wait(80);
      ok(q('.wb-item-widget[data-kind="note"] .nbk-note') === ed, 'the debounced save (data + text) does not rebuild the body while it is being edited');
      var saved = itemsOf('nbOLD_u1').find(function (i) { return i.kind === 'note'; });
      ok(/day 2/.test(saved.text || ''), 'the item\'s plain-text mirror follows the html', saved.text);
      ed.blur();

      /* ── the ＋ pill fans the widget kinds out; tapping one adds a card at the view ── */
      q('.wb-pill[data-pill="widgets"] .wb-pill-btn').click();
      await until(function () { return q('.wb-pill-widgets.wb-open .wb-fan-item'); });
      var rows = qa('.wb-pill-widgets .wb-fan-item').map(function (b) { return b.dataset.kind; });
      ok(rows.indexOf('note') >= 0 && rows.indexOf('calc') >= 0 && rows.indexOf('protocol') >= 0 && rows.indexOf('inventory') >= 0 && rows.indexOf('figure') >= 0 && rows.indexOf('checklist') >= 0 && rows.indexOf('collection') >= 0 && rows.indexOf('paperquote') < 0 && rows.indexOf('litreview') < 0 && rows.indexOf('boardlink') < 0 && rows.indexOf('paper') < 0, 'the ＋ pill fans out note/checklist/calc/protocol/inventory/figure/📑 collection — V3.859: no separate quote or lit review (From paper lives in Tools; the legacy boardlink is hidden)', rows.join(','));
      q('.wb-pill-widgets .wb-fan-item[data-kind="inventory"]').click();
      await until(function () { return itemsOf('nbOLD_u1').some(function (i) { return i.kind === 'inventory'; }); });
