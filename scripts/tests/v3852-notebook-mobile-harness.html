    var n0 = qa('.wb-item-widget').length;

    check('Done closes the sheet and the card repaints with the edits', !sheet() && /Edited on the phone/.test(card('w1').querySelector('.nbk-note').textContent));

    click(card('w2').querySelector('[data-wb-wmenu]')); await sleep(120);
    check('the ⋯ button opens the sheet in SETTINGS mode (no desktop popover)', !!sheet() && mode() === 'settings' && !q('.cw-pop') && shown(pane('settings')) && !shown(pane('content')));

    q('.wb-sheet-back').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await sleep(80);

    /* ── drag vs tap ── */
    var x0 = item('w2').x, y0 = item('w2').y; var c2 = spot(card('w2').querySelector('.wb-wb'));

      var okSpec = okEdit && (!specific[k] || specific[k](b));
      check(k + ': tap → ✎ Edit shows its editor' + (specific[k] ? ' (kind-specific controls present)' : ''), okEdit && okSpec, okEdit ? (b.textContent.trim().slice(0, 60) || b.innerHTML.slice(0, 60)) : ('sheet=' + !!sheet() + ' mode=' + mode()));
      await toSettings();
      var hasActs = actLabels().length >= 3 && /^Remove$/.test(actLabels()[actLabels().length - 1]) && !!q('.wb-sheet-back [data-wb-sheet-title]') && qa('.wb-sheet-back [data-wb-sheet-color]').length === 10 && qa('.wb-sheet-back [data-wb-sheet-w]').length === 4;
      check(k + ': ⚙ Settings has name, colours, widths and its actions' + (kindActs[k] ? ' incl. ' + kindActs[k].source.replace(/\\/g, '') : ''), mode() === 'settings' && hasActs && (!kindActs[k] || kindActs[k].test(actLabels().join('|'))), actLabels().join(' · '));
      await done();
    }

    /* ── remove: two taps (quote card) ── */
    await tapNode(card('w5')); await toSettings();
    var rm = act(/^Remove$/); click(rm); await sleep(60);
    check('Remove arms first (two taps) and the card is still there', !!card('w5') && /Really remove/.test(rm.textContent));
    click(rm); await until(function () { return !card('w5'); }, 3000); await sleep(80);
    check('the second tap removes the card and closes the sheet', !card('w5') && !sheet() && !item('w5'));

    /* ── V3.855 — what the Opus review found ── */
    await tapNode(card('w1'));
    document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await sleep(80);
    check('V3.855: Escape closes the sheet right after a tap-open (focus is not inside it)', !sheet());
    var moreBad = qa('.wb-item-widget').filter(function (c) { var m = c.querySelector('.wb-wmore'); if (!m) return true; var cr = c.getBoundingClientRect(), mr = m.getBoundingClientRect(); return !(getComputedStyle(m).opacity === '1' && mr.width > 0 && mr.right <= cr.right + 1); });
    check('V3.855: ⋯ is visible on a phone and sits inside every card; the kind, stamp and colour dot are off the header', moreBad.length === 0 && qa('.wb-item-widget .wb-wkind').every(function (k) { return getComputedStyle(k).display === 'none'; }) && qa('.wb-wstamp').every(function (k) { return getComputedStyle(k).display === 'none'; }), moreBad.length + ' card(s) with ⋯ hidden or clipped');

    check('V3.855: the calc formula form fits the sheet (no sideways scroll)', !!shEl && shEl.scrollWidth <= shEl.clientWidth + 1, shEl && (shEl.scrollWidth + ' vs ' + shEl.clientWidth));
    var ex = q('.wb-sheet-back [data-f="expression"]');
    if (ex) { ex.value = 'c1 * v1 / v2 * 2'; ex.dispatchEvent(new Event('input', { bubbles: true })); }
    await until(function () { return /^2(\.0+)?\s*mM$/.test(((item('w6') || {}).data || {}).result || ''); }, 5000); await sleep(80);
    check('V3.855: editing the formula in the sheet rebuilds the calculator (1 → 2 mM) with no unhandled error', !!ex && /^2(\.0+)?\s*mM$/.test((item('w6').data || {}).result || '') && window.__rej.length === 0, 'result=' + ((item('w6').data || {}).result) + ' rejections=' + window.__rej.join(' | '));
