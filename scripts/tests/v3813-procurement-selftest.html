var __seq = 0; function newId(p) { return p + (++__seq); }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o, function (k, v) { return v instanceof Date ? { __date: v.toISOString() } : v; }), function (k, v) { return v && v.__date ? new Date(v.__date) : v; }); }
function applyPatch(target, patch) {
  Object.keys(patch).forEach(function (k) {
    var v = patch[k];
    if (v && typeof v === 'object' && Array.isArray(v.__arrayUnion)) {
      var cur = Array.isArray(target[k]) ? target[k] : [];
      v.__arrayUnion.forEach(function (e) { if (!cur.some(function (x) { return JSON.stringify(x) === JSON.stringify(e); })) cur.push(clone(e)); });
      target[k] = cur;
    } else if (v && typeof v === 'object' && v.__stamp === true) target[k] = new Date();

}
function docRef(coll, id) {
  return {
    id: id,
    get: function () { var d = STORE[coll] && STORE[coll][id]; return Promise.resolve({ exists: !!d, id: id, data: function () { return d ? clone(d) : undefined; } }); },
    update: function (patch) { if (!STORE[coll] || !STORE[coll][id]) return Promise.reject(new Error('not-found ' + coll + '/' + id)); applyPatch(STORE[coll][id], patch); window.__writes.push({ op: 'update', coll: coll, id: id, patch: clone(patch) }); return Promise.resolve(); },
    set: function (data) { STORE[coll] = STORE[coll] || {}; STORE[coll][id] = {}; applyPatch(STORE[coll][id], data); window.__writes.push({ op: 'set', coll: coll, id: id, data: clone(data) }); return Promise.resolve(); },
    delete: function () { if (STORE[coll]) delete STORE[coll][id]; window.__writes.push({ op: 'delete', coll: coll, id: id }); return Promise.resolve(); },

}
function collRef(coll) {

    doc: function (id) { return docRef(coll, id || newId('d')); },
    add: function (data) { var id = newId(coll.slice(0, 4) + '_'); STORE[coll] = STORE[coll] || {}; STORE[coll][id] = {}; applyPatch(STORE[coll][id], data); window.__writes.push({ op: 'add', coll: coll, id: id, data: clone(data) }); return Promise.resolve(docRef(coll, id)); },

}

window.LIVE_SYNC = { attach: function () { return { suppressUntil: 0 }; } };
window.LAB_USERS = { isVisible: function () { return true; } };
window.__persona = { uid: 'stu', name: 'Sam Student', role: 'editor', caps: [] };

function become(p) {

  var S = PROCUREMENT.state();
  S.user = firebridge.getUser(); S.profile = firebridge.getProfile();

  S.form = null; S.composer = null; S.q = ''; S.status = '';

}
/* Exploratory knobs — MUST run before procurement.js boots (its boot resumes
 * in a microtask right after its own script tag, before the next inline
 * script), so this lives in the head block.
 *   ?noauto=1          skip the scripted journey below
 *   ?persona=pi|oth|buy start as that person (default: stu, a student)
 *   ?seed=1            start with tickets in every state (ids T_req, T_q, T_app, T_ord, T_rcv, T_pl, T_den, T_can)
 * The persona can also be switched from the DOM-only world through the
 * hidden form #persona-switch (select + Apply), since page globals are not

(function () {
  var q = new URLSearchParams(location.search);
  var PERSONAS = { stu: { uid: 'stu', name: 'Sam Student' }, pi: { uid: 'pi', name: 'The PI', role: 'admin' }, oth: { uid: 'oth', name: 'Otto Other' }, buy: { uid: 'buy', name: 'Bo Buyer', role: 'contributor', caps: ['procurement:order'] }, app: { uid: 'app', name: 'Ava Approver', caps: ['procurement:approve'] } };
  if (q.get('persona') && PERSONAS[q.get('persona')]) { var p = PERSONAS[q.get('persona')]; window.__persona = { uid: p.uid, name: p.name, role: p.role || 'editor', caps: p.caps || [] }; }
  if (q.get('seed') === '1') {
    var now = new Date(), day = 86400000;
    function mk(id, over) { STORE.procurementTickets[id] = Object.assign({ requestedBy: 'stu', requesterName: 'Sam Student', itemDescription: 'Seed ' + id, vendor: 'Sigma-Aldrich', catalogueNumber: 'C-' + id, quantity: 2, unitCost: 25, estimatedCost: 50, category: 'reagent', fundingAccount: '3062920', fundingLabel: 'ONR (3062920)', project: 'MEBP paper', reason: 'Seeded for exploration', urgency: 'routine', status: 'requested', piNotes: '', question: null, issue: null, inventoryItemId: null, history: [{ id: 'h-' + id, at: new Date(now - 6 * day).toISOString(), by: 'stu', byName: 'Sam Student', action: 'submit', from: null, to: 'requested', note: null }], notes: [], watcherUids: ['stu'], lastActorUid: 'stu', lastActivityAt: new Date(now - 6 * day).toISOString(), createdAt: new Date(now - 6 * day), updatedAt: new Date(now - 6 * day) }, over || {}); }

    mk('T_app2', { status: 'approved', approvedBy: 'pi', approvedByName: 'The PI', approvedAt: new Date(now - 2 * day), vendor: 'sigma aldrich', itemDescription: 'Seed T_app2 (same vendor as T_app)' });
    mk('T_ord', { status: 'ordered', approvedBy: 'pi', approvedByName: 'The PI', approvedAt: new Date(now - 3 * day), orderedBy: 'pi', orderedByName: 'The PI', orderedAt: new Date(now - 2 * day), poNumber: 'PO-77', purchaseMethod: 'buyways', orderDate: new Date(now - 2 * day).toISOString().slice(0, 10), expectedDelivery: new Date(now - day).toISOString().slice(0, 10), poUrl: 'https://stub.storage/po.pdf' });

<body>
  <div class="page">
    <div class="page-header"><h1 class="page-title">Procurement (self-test)</h1></div>
    <div id="proc-root"><div class="empty-state">Loading…</div></div>
  </div>
  <div id="r">running…</div>
<script src="/rm/js/procurement-core.js"></script>
<script src="/rm/js/procurement.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (new URLSearchParams(location.search).get('noauto') !== '1') setTimeout(run, 80);
  else { var r = document.getElementById('r'); r.textContent = 'noauto — drive it by hand (persona switch top-right)'; r.dataset.done = '1'; r.dataset.pass = '0'; r.dataset.fail = '0'; }
});
async function run() {
  var out = document.getElementById('r'), lines = [], pass = 0, fail = 0;
  var ok = function (c, m) { if (c) { pass++; lines.push('<span class="ok">✓</span> ' + m); } else { fail++; lines.push('<span class="bad">✗ ' + m + '</span>'); } };
  var eq = function (a, b, m) { var A = JSON.stringify(a), B = JSON.stringify(b); ok(A === B, m + '  →  ' + A + (A === B ? '' : '  (want ' + B + ')')); };
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var $ = function (s) { return document.querySelector(s); }, $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var typeInto = function (el, v) { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
  var f = function (key, scope) { return (scope || document).querySelector('[data-f="' + key + '"]'); };
  var row = function (id) { return $('.pt-row[data-id="' + id + '"]'); };
  var openRow = async function (id) { var r = row(id); if (!r) return null; if (!r.classList.contains('is-open')) { r.querySelector('[data-toggle]').click(); await sleep(20); } return row(id); };
  var actions = function (id) { return Array.prototype.slice.call(row(id).querySelectorAll('.pt-actions [data-act]')).map(function (b) { return b.dataset.act; }); };
  var clickAct = async function (id, act) { var r = await openRow(id); r.querySelector('.pt-actions [data-act="' + act + '"]').click(); await sleep(20); return row(id).querySelector('.pt-form'); };
  var submit = async function (form) { form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true })); await sleep(60); };
  var T = function (id) { return STORE.procurementTickets[id]; };
  var lastWrite = function (op, coll) { for (var i = window.__writes.length - 1; i >= 0; i--) { var w = window.__writes[i]; if (w.op === op && (!coll || w.coll === coll)) return w; } return null; };
  var tabs = function () { return $$('.pt-tab').map(function (b) { return b.dataset.view + (b.classList.contains('is-active') ? '*' : ''); }); };
  var view = function (v) { $('.pt-tab[data-view="' + v + '"]').click(); };
  var fieldErr = function (scope, key) { var e = scope.querySelector('[data-field="' + key + '"] .pt-field-err'); return e && !e.hidden ? e.textContent : ''; };
  try {
    for (var i = 0; i < 50 && !$('.pt-top'); i++) await sleep(50);
    lines.push('<b>Load (student)</b>');
    ok(!!$('.pt-top'), 'page rendered');
    eq(tabs(), ['inbox*', 'active', 'mine', 'archive'], 'student sees four views, no Report');
    ok(/Nothing needs you/.test($('#pt-body').textContent), 'empty inbox says so');

    lines.push('\n<b>Submit</b>');
    $('#pt-new').click(); await sleep(20);
    var cf = $('#pt-composer-form'); ok(!!cf, 'composer opens inline');
    await submit(cf);
    ok(fieldErr(cf, 'itemDescription') === 'Say what you need.', 'empty submit → inline error on the item field (' + fieldErr(cf, 'itemDescription') + ')');
    ok(document.activeElement === f('itemDescription', cf), 'the offending field is focused');
    typeInto(f('itemDescription', cf), 'PEG 6000, 100 g'); typeInto(f('vendor', cf), 'Sigma-Aldrich'); typeInto(f('catalogueNumber', cf), '81260');
    typeInto(f('productUrl', cf), 'https://sigma.com/81260'); typeInto(f('quantity', cf), '2'); typeInto(f('unitCost', cf), '50');
    eq(f('estimatedCost', cf).value, '$100.00', 'estimated total follows unit × qty');
    typeInto(f('category', cf), 'reagent'); typeInto(f('urgency', cf), 'urgent');
    typeInto(f('reason', cf), 'Gels for the Friday run');
    await submit(cf);
    ok(/which project/.test(fieldErr(cf, 'projectId')), 'project required, inline (' + fieldErr(cf, 'projectId') + ')');
    eq($$('[data-f="projectId"] option', cf).map(function (o) { return o.value; }), ['', 'mcghee-startup', 'prostate', '__other'], 'project list = active funded projects + Other (expired one hidden)');
    typeInto(f('projectId', cf), 'prostate');
    eq(cf.querySelector('[data-charged]').value, 'Cancer Engineering - Prostate · 1101917-MCMI', 'choosing the project fills “Charged to” with its funding string');
    await submit(cf);
    ok(/one-time purchase or something we will buy again/.test(fieldErr(cf, 'purchaseType')), 'V3.814: one-time vs recurring is required, inline (' + fieldErr(cf, 'purchaseType') + ')');
    ok(f('recurrence', cf).hidden, 'the how-often select is hidden until "recurring" is chosen');
    typeInto(f('purchaseType', cf), 'recurring');
    ok(!f('recurrence', cf).hidden, 'choosing recurring reveals how-often');
    typeInto(f('recurrence', cf), 'monthly');
    await submit(cf);
    var w = lastWrite('add', 'procurementTickets'); var peg = w && w.id;
    eq([w.data.purchaseType, w.data.recurrence, w.data.comparisons], ['recurring', 'monthly', []], 'create payload carries purchase type + recurrence (no comparison given)');
    ok(!!peg, 'ticket written');
    eq([w.data.status, w.data.estimatedCost, w.data.requestedBy, w.data.history.length, w.data.watcherUids, w.data.projectId, w.data.project, w.data.fundingAccount, w.data.fundingLabel, w.data.urgency, w.data.lastActorUid], ['requested', 100, 'stu', 1, ['stu'], 'prostate', 'Cancer Engineering - Prostate', '1101917-MCMI', 'Cancer Engineering - Prostate · 1101917-MCMI', 'urgent', 'stu'], 'create payload carries project + funding string');
    ok(!!w.data.createdAt && w.data.createdAt.__stamp === true, 'createdAt is a server timestamp');
    ok(!$('#pt-composer-form'), 'composer closed');
    eq(tabs(), ['inbox', 'active', 'mine*', 'archive'], 'jumps to Mine');
    ok(row(peg) && row(peg).classList.contains('is-open'), 'new ticket shown expanded');
    ok(/Requested/.test(row(peg).querySelector('.pt-chip').textContent) && /urgent/.test(row(peg).querySelector('.pt-row-flags').textContent), 'chip Requested + urgent flag');
    eq(actions(peg), ['edit', 'cancel', 'note', 'link'], 'requester actions');
    ok($('#toast-stack') && /Request submitted/.test($('#toast-stack').textContent), 'toast, not alert');
    // three more requests for later steps
    async function quick(item, vendor, projectId) { $('#pt-new').click(); await sleep(10); var c = $('#pt-composer-form'); typeInto(f('itemDescription', c), item); typeInto(f('vendor', c), vendor || ''); typeInto(f('unitCost', c), '80'); typeInto(f('reason', c), 'r'); typeInto(f('projectId', c), projectId || 'mcghee-startup'); if (projectId === '__other') typeInto(f('projectOther', c), 'Side project'); typeInto(f('purchaseType', c), 'one_time'); await submit(c); return lastWrite('add', 'procurementTickets').id; }
    var tips = await quick('Pipette tips 200 µL', 'sigma aldrich');
    var den = await quick('Gold-plated centrifuge', 'Beckman');
    var wd = await quick('Something I no longer need', '');
    eq(Object.keys(STORE.procurementTickets).length, 4, 'four tickets');

    lines.push('\n<b>Ask ⇄ answer</b>');
    become({ uid: 'pi', name: 'The PI', role: 'admin' }); await sleep(20);
    eq(tabs(), ['inbox*', 'active', 'mine', 'archive', 'report'], 'PI sees Report');
    ok($('.pt-section[data-section="approve"]') && /4/.test($('.pt-section[data-section="approve"] h3').textContent), 'inbox: 4 waiting for approval');
    eq(actions(peg), ['approve', 'ask', 'deny', 'edit', 'reassign', 'note', 'delete', 'link'], 'PI actions on a request (incl. Change funding)');
    var form = await clickAct(peg, 'ask');
    ok(!!form && form.dataset.form === 'ask', 'ask opens an inline form');
    await submit(form);
    ok(fieldErr(row(peg).querySelector('.pt-form'), 'note') === 'Type the question.', 'empty question → inline error');
    typeInto(f('note', row(peg).querySelector('.pt-form')), 'Which molecular weight exactly?');
    await submit(row(peg).querySelector('.pt-form'));
    eq([T(peg).status, T(peg).question, T(peg).notes.length, T(peg).notes[0].kind], ['needs_info', 'Which molecular weight exactly?', 1, 'question'], 'ask → needs_info with the question in the thread');

    lines.push('\n<b>V3.814 — Request again</b>');

    var wg = lastWrite('add', 'procurementTickets');

    ok(!!pkc && document.activeElement === $('#pt-pk-q'), 'Reorder existing opens the picker and focuses its search');
    ok($$('.pt-pk-row').length >= 4 && /of \d+ items/.test($('.pt-pk-count').textContent), 'the catalogue lists inventory + previously approved items (' + $('.pt-pk-count').textContent + ')');
    ok(!!pkc.querySelector('[data-pick-entry="inv:INV1"]') && !!pkc.querySelector('[data-pick-entry="inv:INV2"]'), 'both seeded inventory items are rows');
    ok(!$$('.pt-pk-row').some(function (r) { return /Draft test|Gold-plated|keep me/.test(r.textContent); }), 'requested and denied tickets are not offered');
    ok(/Nitrile gloves M/.test(pkc.querySelector('[data-entry="inv:INV2"]').textContent) && /bought 1×/.test(pkc.querySelector('[data-entry="inv:INV2"]').textContent), 'an approved order for a stocked item folds into that item (bought 1×)');
    ok($$('.pt-pk-head').some(function (h) { return /Consumables/.test(h.textContent); }), 'grouped by category by default');
    ok(/low/.test(pkc.querySelector('[data-entry="inv:INV1"] .pt-pk-badge--low').textContent) && /4 ea left at Bench 4/.test(pkc.querySelector('[data-entry="inv:INV1"]').textContent), 'a tracked item below its minimum is badged low, with count and location');
    $('#pt-pk-q').focus(); typeInto($('#pt-pk-q'), 't-200'); await sleep(20);
    ok($$('.pt-pk-row').length === 1 && !!$('[data-entry="inv:INV1"]') && document.activeElement === $('#pt-pk-q'), 'search by catalogue # narrows to one row and keeps focus');
    typeInto($('#pt-pk-q'), ''); typeInto($('[data-pk="group"]'), 'vendor'); await sleep(20);
    ok($$('.pt-pk-head').some(function (h) { return /^Sigma/.test(h.textContent.trim()); }) && $$('.pt-pk-head').some(function (h) { return /^Fisher/.test(h.textContent.trim()); }), 'group by vendor');

    ok(PROC_CORE.catalogue([], [Object.assign({ id: wc.id }, STORE.procurementTickets[wc.id], { status: 'approved' })], PROCUREMENT.state().watches)[0].watchPrice === 18.75, 'the catalogue would show it as the list price');
    var capDoc = STORE['userData/stu/procurementCaptures'].cap1;
    eq([capDoc.status, capDoc.ticketId === wc.id, !!capDoc.usedAtIso], ['used', true, true], 'the capture is marked used with the ticket id — nothing else is written until approval');
    ok(!!$('#pt-captures-card') && $$('.pt-cap-row').length === 1 && !!$('[data-cap="cap2"]'), 'the strip now shows only the other capture');
    ok(!PROC_CORE.catalogue(Object.keys(STORE.inventory).map(function (id) { return Object.assign({ id: id }, STORE.inventory[id]); }), Object.keys(STORE.procurementTickets).map(function (id) { return Object.assign({ id: id }, STORE.procurementTickets[id]); })).some(function (e) { return /ELISA plates/.test(e.name); }), 'a requested (not yet approved) capture is NOT in the Reorder existing catalogue');
    become({ uid: 'pi', name: 'The PI', role: 'admin' }); await sleep(20);
    form = await clickAct(wc.id, 'approve'); await submit(form); await sleep(20);
    ok(PROC_CORE.catalogue([], Object.keys(STORE.procurementTickets).map(function (id) { return Object.assign({ id: id }, STORE.procurementTickets[id]); })).some(function (e) { return /ELISA plates/.test(e.name) && e.status === 'approved'; }), 'once approved it IS in the catalogue (the "database")');

    PROCUREMENT.state().captures = [Object.assign({ id: 'cap2' }, STORE['userData/stu/procurementCaptures'].cap2)]; PROCUREMENT.render(); await sleep(20);
    $('[data-cap-drop="cap2"]').click(); await sleep(30);
    ok(!STORE['userData/stu/procurementCaptures'].cap2 && lastWrite('delete').id === 'cap2' && !$('#pt-captures-card'), 'Discard deletes the capture and the strip goes away when the queue is empty');

    lines.push('\n<b>Hygiene</b>');
    eq(window.__popups, [], 'no window.prompt / confirm / alert, ever');
    ok(document.body.innerText.indexOf('<svg') < 0, 'no markup reached a text sink');
    ok(!$$('.pt-field-err:not([hidden])').length, 'no stray field errors');
    eq(Object.keys(STORE.procurementTickets).length, 14, 'fourteen tickets remain');
  } catch (e) {
    fail++; lines.push('<span class="bad">✗ EXCEPTION ' + (e && e.stack || e) + '</span>');
  }
  out.innerHTML = lines.join('\n') + '\n\n' + pass + ' passed, ' + fail + ' failed';
  out.dataset.pass = pass; out.dataset.fail = fail; out.dataset.done = '1';
  out.dataset.detail = lines.filter(function (l) { return l.indexOf('✗') >= 0; }).map(function (l) { return l.replace(/<[^>]+>/g, ''); }).slice(0, 6).join(' | ');
  document.title = 'V3813 ' + (fail ? 'FAIL (' + fail + ')' : 'PASS (' + pass + ')');
}
