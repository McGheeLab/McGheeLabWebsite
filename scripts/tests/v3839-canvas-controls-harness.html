  function docsIn(path) { var out = []; store.forEach(function (v, k) { if (k.slice(0, k.lastIndexOf('/')) === path) out.push(snapOf(k)); }); return out; }
  function fire(path, type) {
    var parent = path.slice(0, path.lastIndexOf('/'));
    listeners.slice().forEach(function (l) {
      if (l.kind === 'doc' && l.path === path) l.cb(snapOf(path));
      if (l.kind === 'col' && l.path === parent) l.cb({ docChanges: function () { return [{ type: type, doc: snapOf(path) }]; }, docs: docsIn(parent), size: 1, empty: false });
    });
  }
  function applyUpdate(path, d) { var next = Object.assign({}, store.get(path) || {}); Object.keys(d).forEach(function (k) { if (d[k] === '__DEL__') delete next[k]; else if (d[k] && d[k].__arrayUnion) next[k] = (next[k] || []).concat([d[k].__arrayUnion]); else next[k] = JSON.parse(JSON.stringify(d[k])); }); store.set(path, next); fire(path, 'modified'); }
  function docRef(path) {
    return {
      path: path, id: path.split('/').pop(),
      collection: function (n) { return colRef(path + '/' + n); },
      get: function () { touched.push('get ' + path); return Promise.resolve(snapOf(path)); },
      set: function (d, o) { touched.push('set ' + path); var existed = store.has(path); store.set(path, (o && o.merge) ? Object.assign({}, store.get(path) || {}, JSON.parse(JSON.stringify(d))) : JSON.parse(JSON.stringify(d))); fire(path, existed ? 'modified' : 'added'); return Promise.resolve(); },
      update: function (d) { touched.push('update ' + path); applyUpdate(path, d); return Promise.resolve(); },
      delete: function () { touched.push('delete ' + path); store.delete(path); fire(path, 'removed'); return Promise.resolve(); },
      onSnapshot: function (cb) { touched.push('listen ' + path); var l = { path: path, kind: 'doc', cb: cb }; listeners.push(l); setTimeout(function () { cb(snapOf(path)); }, 0); return function () { var i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; }
    };
  }
  function colRef(path) {
    var q = { path: path,
      doc: function (id) { return docRef(path + '/' + (id || ('auto' + Math.random().toString(36).slice(2, 8)))); },
      orderBy: function () { return q; }, where: function () { return q; }, limit: function () { return q; },

    };

  }
  var db = {

  };

<h1>V3.839 — canvas controls on a host board</h1>
<p>Serve the repo root and open <code>/scripts/tests/v3839-canvas-controls-harness.html</code>. Real <code>whiteboard.js</code> on a notebook board with pills, against a stub Firestore. Result: <code>#r[data-done=1]</code>.</p>

<script>
(function () {
  var out = [], pass = 0, fail = 0;
  function ok(c, m, got) { if (c) pass++; else fail++; out.push('<div class="' + (c ? 'ok' : 'bad') + '">' + (c ? '✓' : '✗') + ' ' + m + (got !== undefined ? '  →  <code>' + String(got).replace(/</g, '&lt;') + '</code>' : '') + '</div>'); }
  function done() { var r = document.getElementById('r'); r.innerHTML = '<b>' + pass + ' passed, ' + fail + ' failed</b>' + out.join(''); r.dataset.done = '1'; r.dataset.pass = pass; r.dataset.fail = fail; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function until(fn, ms) { ms = ms || 4000; var t0 = Date.now(); return new Promise(function (res, rej) { (function poll() { var v; try { v = fn(); } catch (e) {} if (v) return res(v); if (Date.now() - t0 > ms) return rej(new Error('timeout: ' + fn.toString().slice(0, 90))); setTimeout(poll, 40); })(); }); }
  var q = function (s) { return document.querySelector(s); }, qa = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var store = window.__stub.store;
  var BOARD = 'userData/u1/notebookBoards/nb9_u1';
  var strokes = function () { var o = []; store.forEach(function (v, k) { if (k.indexOf(BOARD + '/strokes/') === 0) o.push(v); }); return o; };
  var items = function () { var o = []; store.forEach(function (v, k) { if (k.indexOf(BOARD + '/items/') === 0) o.push(Object.assign({ id: k.split('/').pop() }, v)); }); return o; };
  var wires = function () { var o = []; store.forEach(function (v, k) { if (k.indexOf(BOARD + '/wires/') === 0) o.push(Object.assign({ id: k.split('/').pop() }, v)); }); return o; };
  var pe = function (type, target, x, y, extra) { var e = new PointerEvent(type, Object.assign({ bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 5, pointerType: 'pen', pressure: 0.7, button: 0, isPrimary: true }, extra || {})); target.dispatchEvent(e); };
  async function drawStroke(x0, y0, x1, y1) {
    var ink = q('.wb-canvas-ink'), r = ink.getBoundingClientRect();
    pe('pointerdown', ink, r.left + x0, r.top + y0);
    var n = 8; for (var i = 1; i <= n; i++) pe('pointermove', ink, r.left + x0 + (x1 - x0) * i / n, r.top + y0 + (y1 - y0) * i / n);
    pe('pointerup', ink, r.left + x1, r.top + y1);
    await wait(120);
  }
  function inkAlphaAt(x, y) { var ink = q('.wb-canvas-ink'); var dpr = ink.width / Math.max(1, ink.clientWidth); var r = ink.getBoundingClientRect(); var d = ink.getContext('2d').getImageData(Math.round(x * dpr), Math.round(y * dpr), 1, 1).data; return d[3]; }

  (async function () {
    try {
      var drops = [], connected = [], pastes = [];
      CANVAS_WIDGETS.basic.registerHtmlFrame({ upload: async function (f) { return { download_url: 'about:blank', storage_path: 'canvas-files/u1/x/' + f.name, name: f.name, size_bytes: f.size }; }, toast: function () {} });
      var host = document.getElementById('host');
      host.innerHTML = Whiteboard.boardShellHTML({ classId: 'u1', ids: false, back: false, zoomControls: false, maximize: false, topbar: false });
      var h = await Whiteboard.mountBoardView(host.querySelector('.wb-page'), {
        classId: 'u1', boardId: 'nb9_u1', collection: 'notebookBoards', ownerUid: 'u1', boardName: 'Controls',
        chrome: 'full', view: { enabled: true }, items: { enabled: true }, pills: true, fitWidth: true,
        wires: { enabled: true },
        onDrop: function (files, at) { drops.push({ n: files.length, names: files.map(function (f) { return f.name; }), at: at }); },
        onPaste: function (p) { pastes.push(p); },
        onConnectDone: function (id) { connected.push(id); },
        widgets: { render: function (it, body, api) { var def = CANVAS_WIDGETS.get(it.kind); if (def && def.render) { def.render(it, body, api); return; } body.textContent = it.text || ''; }, meta: function (k) { var m = CANVAS_WIDGETS.meta(k); return m || { label: k, glyph: '' }; }, summary: function (it) { return CANVAS_WIDGETS.summary(it) || it.text || ''; } }
      });
      ok(!!h, 'mounts a notebook board with pills');
      await until(function () { return h.getBoard() && q('.wb-pill[data-pill="pens"] .wb-pill-btn'); });
      ok(h.isAdmin(), 'the owner draws');

      /* ── 1. the pen set: 4 pens + 1 highlighter by default, ＋ pen / ＋ highlighter ── */
      var cp = h.currentPen();
      ok(cp && cp.id === 'pen1' && cp.hl === false && cp.color === '#111827', 'the first pen of the set is in hand at mount', JSON.stringify(cp));
      q('.wb-pill[data-pill="pens"] .wb-pill-btn').click();
      await until(function () { return q('.wb-pill-pens.wb-open .wb-fan-item'); });
      ok(qa('.wb-pill-pens .wb-fan-item[data-wb-act="pen-pick"]').length === 5 && qa('.wb-pill-pens .wb-fan-item[data-wb-act="pen-pick"] .wb-fan-dot-hl').length === 0 && q('.wb-pill-pens .wb-fan-item[data-pen="er1"] .wb-fan-eraser'), 'V3.860 — Pen\'s second arc: 4 pens + the eraser of the set (highlighters live under Highlighter)', qa('.wb-pill-pens .wb-fan-item[data-wb-act="pen-pick"]').length);
      ok(qa('.wb-pill-pens .wb-fan-item[data-wb-act="pen-add"]').length === 1 && q('.wb-pill-pens .wb-fan-item[data-wb-act="width"]') && !q('.wb-pill-pens .wb-fan-item[data-wb-act="eraser"]'), '＋ pen and widths are there; no second eraser button');
      var pos = qa('.wb-pill-pens .wb-fan-item').map(function (b) { return b.style.getPropertyValue('--tx') + '/' + b.style.getPropertyValue('--ty'); });
      ok(new Set(pos).size === pos.length && pos.length === 16, 'sixteen fan items — V3.860: the five modes, then Pen\'s options — each with its own arc position (three rings)', pos.length);
      ok(pos.every(function (v) { var m = v.match(/(-?\d+)px\/(-?\d+)px/); return m && +m[1] >= 0 && +m[2] <= 0; }), 'bottom-left pill: the arc opens up and to the right');

      /* add a highlighter → in hand, editor open, saved on the device (V3.860: from Highlighter's second arc) */
      q('.wb-pill-pens .wb-fan-item[data-wb-act="hand-hl"]').click(); await until(function () { return q('.wb-pill-pens.wb-open .wb-fan-item[data-wb-act="pen-add"][data-kind="hl"]'); });
      q('.wb-pill-pens .wb-fan-item[data-wb-act="pen-add"][data-kind="hl"]').click();
      await until(function () { return q('.wb-pen-edit'); });
      cp = h.currentPen();
      ok(h.getPens().length === 7 && cp.hl === true && cp.w === 0.014, '＋ highlighter: seven in the set, the new one in hand (hl, 0.014 wide)', JSON.stringify(cp));
      ok(JSON.parse(localStorage.getItem('wb_pens_v1')).length === 7, 'the pen set is saved on the device (wb_pens_v1)');
      ok(q('.wb-pill-pens.wb-open') && q('.wb-pen-edit .wb-pe-kind.wb-sel').textContent === 'Highlighter' && qa('.wb-pen-edit .wb-pe-swatch').length === 20 && q('.wb-pen-edit input[type=color]') && q('.wb-pen-edit input[type=range]'), 'the pen editor opens beside the fan: Highlighter selected, 20 swatches, a custom colour input, a width slider');
      /* swatch, custom colour, width slider */
      q('.wb-pen-edit .wb-pe-swatch[data-v="#86efac"]').click(); await wait(20);
      ok(h.currentPen().color === '#86efac' && q('.wb-pill-pens .wb-pill-dot').style.background.indexOf('134, 239, 172') >= 0, 'a swatch recolours the pen in hand (status dot follows)', h.currentPen().color);
      var ci = q('.wb-pen-edit input[type=color]'); ci.value = '#ff0000'; ci.dispatchEvent(new Event('input', { bubbles: true })); await wait(20);
      ok(h.currentPen().color === '#ff0000' && q('.wb-pen-edit .wb-pe-line').style.background.indexOf('255, 0, 0') >= 0, 'the custom colour input sets ANY colour (live preview, no re-render)', h.currentPen().color);
      var rg = q('.wb-pen-edit input[type=range]'); rg.value = '100'; rg.dispatchEvent(new Event('input', { bubbles: true })); await wait(20);
      ok(Math.abs(h.currentPen().w - 0.04) < 1e-9 && q('.wb-pen-edit'), 'the width slider sets the pen width (highlighter range up to 0.04)', h.currentPen().w);
      rg.dispatchEvent(new Event('change', { bubbles: true })); await wait(20);
      ok(q('.wb-pen-edit') && +q('.wb-pen-edit input[type=range]').value === 100, 'releasing the slider re-renders the editor with the new value');
      ok(JSON.parse(localStorage.getItem('wb_pens_v1')).some(function (p) { return p.color === '#ff0000' && p.kind === 'hl' && Math.abs(p.w - 0.04) < 1e-9; }), 'the edited highlighter is saved');

      /* ── 2. a highlighter stroke: hl:true, uniform pressure, translucent multiplied band ── */
      q('.wb-pen-edit [data-wb-pe="done"]').click(); await wait(20);
      ok(!q('.wb-pen-edit') && !q('.wb-pill-pens.wb-open'), 'Done closes the editor and folds the fan');
      await drawStroke(100, 120, 420, 120);
      await until(function () { return strokes().length === 1; });
      var hs = strokes()[0];
      ok(hs.hl === true && hs.color === '#ff0000' && Math.abs(hs.w - 0.04) < 1e-9, 'the stroke doc carries hl:true, the highlighter colour and width', JSON.stringify({ hl: hs.hl, color: hs.color, w: hs.w }));
      var press = []; for (var i = 2; i < hs.pts.length; i += 3) press.push(hs.pts[i]);
      ok(press.length && press.every(function (p) { return p === 0.5; }), 'highlighter pressure is uniform (0.5 at every point)', press.join(','));
      await wait(150);
      var inkC = q('.wb-canvas-ink'), idata = inkC.getContext('2d').getImageData(0, 0, inkC.width, inkC.height).data, cnt = 0, bx = [1e9, 1e9, -1, -1];
      for (var yy = 0; yy < inkC.height; yy += 3) for (var xx = 0; xx < inkC.width; xx += 3) { if (idata[(yy * inkC.width + xx) * 4 + 3] > 0) { cnt++; bx[0] = Math.min(bx[0], xx); bx[1] = Math.min(bx[1], yy); bx[2] = Math.max(bx[2], xx); bx[3] = Math.max(bx[3], yy); } }
      var liveC = q('.wb-canvas-live'), ldata = liveC.getContext('2d').getImageData(0, 0, liveC.width, liveC.height).data, lcnt = 0; for (var k = 3; k < ldata.length; k += 4 * 7) if (ldata[k] > 0) lcnt++;
      ok(true, 'ink canvas ' + inkC.width + 'x' + inkC.height + ': painted samples=' + cnt + ' bbox=' + bx.join(',') + ' · live samples=' + lcnt + ' · stroke pts=' + JSON.stringify(hs.pts.slice(0, 6)) + ' view=' + JSON.stringify(h.getView()));
      var a1 = inkAlphaAt(260, 120);
      ok(a1 > 60 && a1 < 170, 'the committed band is translucent on the ink canvas (alpha ≈ 0.42)', a1);

      /* ── 3. back to a pen: opaque, no hl field; widths edit the pen in hand ── */
      q('.wb-pill[data-pill="pens"] .wb-pill-btn').click(); await until(function () { return q('.wb-pill-pens.wb-open .wb-fan-item[data-wb-act="hand-pen"]'); });
      q('.wb-pill-pens .wb-fan-item[data-wb-act="hand-pen"]').click(); await until(function () { return q('.wb-pill-pens.wb-open .wb-fan-item[data-pen="pen1"].wb-sel'); });   /* V3.860 — ✎ Pen puts the last pen back in hand; its second arc holds the pens */
      q('.wb-pill-pens .wb-fan-item[data-pen="pen2"]').click(); await wait(20);
      ok(h.currentPen().id === 'pen2' && h.currentPen().hl === false && !q('.wb-pill-pens.wb-open'), 'V3.860: ✎ Pen brings the last pen back; picking another pen folds the fan and puts it in hand');
      q('.wb-pill[data-pill="pens"] .wb-pill-btn').click(); await until(function () { return q('.wb-pill-pens.wb-open .wb-fan-item[data-pen="pen1"]'); });
      q('.wb-pill-pens .wb-fan-item[data-pen="pen1"]').click(); await wait(20);
      ok(h.currentPen().id === 'pen1' && !q('.wb-pill-pens.wb-open'), 'and back to pen1');
      await drawStroke(100, 240, 420, 240);
      await until(function () { return strokes().length === 2; });
      var ps = strokes().filter(function (s) { return !s.hl; })[0];
      ok(ps && !('hl' in ps) && ps.color === '#111827', 'a pen stroke has no hl field (never an undefined field in Firestore)', JSON.stringify(Object.keys(ps)));
      await wait(150);
      ok(inkAlphaAt(260, 240) === 255, 'pen ink is opaque', inkAlphaAt(260, 240));
      q('.wb-pill[data-pill="pens"] .wb-pill-btn').click(); await until(function () { return q('.wb-pill-pens.wb-open'); });
      q('.wb-pill-pens .wb-fan-item[data-wb-act="width"][data-w="0.008"]').click(); await wait(20);
      ok(Math.abs(h.currentPen().w - 0.008) < 1e-9 && JSON.parse(localStorage.getItem('wb_pens_v1')).find(function (p) { return p.id === 'pen1'; }).w === 0.008, 'a width from the fan is kept on the pen in hand');
      /* tap the pen in hand again → its editor; Remove takes two taps */
      q('.wb-pill[data-pill="pens"] .wb-pill-btn').click(); await until(function () { return q('.wb-pill-pens.wb-open'); });
      q('.wb-pill-pens .wb-fan-item[data-pen="pen1"]').click(); await until(function () { return q('.wb-pen-edit'); });
      ok(q('.wb-pen-edit .wb-pe-kind.wb-sel').textContent === 'Pen' && q('.wb-pill-pens.wb-open'), 'tapping the pen in hand again opens its editor (fan stays open)');
      var rm = q('.wb-pen-edit [data-wb-pe="remove"]'); rm.click(); await wait(20);
      ok(h.getPens().length === 7 && q('.wb-pen-edit'), 'first tap on Remove only arms it');
      q('.wb-pen-edit [data-wb-pe="remove"]').click(); await wait(30);
      ok(h.getPens().length === 6 && !h.getPens().some(function (p) { return p.id === 'pen1'; }) && h.currentPen().id === 'pen2' && !q('.wb-pen-edit'), 'second tap removes the pen; the next pen is in hand', h.currentPen().id);
      if (q('.wb-pill-pens.wb-open')) { q('.wb-pill[data-pill="pens"] .wb-pill-btn').click(); await wait(20); }

      /* ── 4. a card: colour dot + palette, corner grip scales it ── */
      var wid = await h.addWidget({ kind: 'note', title: 'Reading', text: 'ERK waves', w: 0.42, pageId: 'p1', x: 0.1, y: 0.05 });
      await until(function () { return q('.wb-item-widget[data-item-id="' + wid + '"] .wb-wtint'); });
      var node = q('.wb-item-widget[data-item-id="' + wid + '"]');
      ok(!!node.querySelector('.wb-wtint') && !!node.querySelector('.wb-wgrip'), 'the card has a colour dot in its header and a corner grip');
      node.querySelector('.wb-wtint').click(); await wait(20);
      ok(node.querySelector('.wb-tint-pop') && node.querySelectorAll('.wb-tint-sw').length === 10 && node.querySelector('.wb-tint-sw.wb-tint-none.wb-sel'), 'the colour dot opens a palette of 10 (none selected)');
      node.querySelector('.wb-tint-sw[data-color="#dbeafe"]').click();
      await until(function () { var it = items().find(function (i) { return i.id === wid; }); return it && it.color === '#dbeafe'; });
      ok(node.classList.contains('wb-tinted') && node.style.getPropertyValue('--wb-card') === '#dbeafe' && !node.querySelector('.wb-tint-pop'), 'the card takes the colour (--wb-card, .wb-tinted) and the palette closes');
      ok(getComputedStyle(node.querySelector('.wb-wh')).backgroundColor === 'rgb(219, 234, 254)', 'the header is filled with the colour', getComputedStyle(node.querySelector('.wb-wh')).backgroundColor);
      /* grip: +220 px → wider card, bigger text */
      var fs0 = parseFloat(node.style.fontSize), w0 = items().find(function (i) { return i.id === wid; }).w;
      var grip = node.querySelector('.wb-wgrip'), gr = grip.getBoundingClientRect(), layer = q('.wb-widgets');
      var mev = function (type, x, y, target) { var e = new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 9, pointerType: 'mouse', button: 0 }); (target || layer).dispatchEvent(e); };
      mev('pointerdown', gr.left + 4, gr.top + 4, grip);
      mev('pointermove', gr.left + 110, gr.top + 4);
      mev('pointermove', gr.left + 224, gr.top + 4);
      mev('pointerup', gr.left + 224, gr.top + 4);
      await until(function () { var it = items().find(function (i) { return i.id === wid; }); return it && it.w > w0 + 0.1; });
