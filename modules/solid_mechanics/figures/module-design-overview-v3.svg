<svg xmlns="http://www.w3.org/2000/svg" width="216pt" height="360pt" viewBox="0 0 216 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="atom" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </radialGradient>
  </defs>

  <!-- ================= TITLE CARD ================= -->
  <rect x="4" y="4" width="186" height="30" rx="5" fill="url(#hdr)"/>
  <text x="10" y="17" font-size="9.5" font-weight="bold" fill="#ffffff">Anatomy of an Interactive Lesson</text>
  <text x="10" y="28" font-size="7" fill="#ffffff" opacity="0.85">Solid Mechanics Foundations · Lesson 1, page 1</text>

  <!-- ================= CONCEPT SCAFFOLD ================= -->
  <rect x="4" y="39" width="36" height="14" rx="7" fill="#2563eb"/>
  <text x="22" y="48.5" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">1 Bond</text>
  <rect x="43" y="39" width="40" height="14" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="63" y="48.5" font-size="7" font-weight="bold" fill="#1e3a5f" text-anchor="middle">2 Spring</text>
  <rect x="86" y="39" width="50" height="14" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="111" y="48.5" font-size="7" font-weight="bold" fill="#1e3a5f" text-anchor="middle">3 Real spring</text>
  <rect x="139" y="39" width="50" height="14" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.9"/>
  <text x="164" y="48.5" font-size="7" font-weight="bold" fill="#1e3a5f" text-anchor="middle">4 Energy well</text>
  <text x="6" y="62" font-size="7.5"><tspan font-weight="bold" fill="#1e293b">Concept scaffold</tspan><tspan fill="#64748b"> — each tab adds exactly one idea.</tspan></text>

  <!-- ================= SECTION 1 HEADER ================= -->
  <circle cx="10" cy="71" r="5" fill="#2563eb"/>
  <text x="10" y="73.7" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="19" y="74" font-size="9" font-weight="bold" fill="#1e293b">Learn the mathematics</text>
  <text x="122" y="74" font-size="7.5" fill="#94a3b8">build the model</text>

  <!-- ================= CARD 1 ================= -->
  <rect x="4" y="79" width="186" height="79" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.9"/>
  <text x="12" y="90" font-size="7" font-weight="bold" fill="#1e293b">Background: two atoms, one invisible tug-of-war</text>
  <rect x="12" y="95" width="166" height="2.5" rx="1.25" fill="#cbd5e1"/>
  <rect x="12" y="100" width="120" height="2.5" rx="1.25" fill="#cbd5e1"/>

  <!-- plain-language governing rule -->
  <rect x="12" y="106" width="170" height="19" rx="2.5" fill="#eff6ff"/>
  <rect x="12" y="106" width="2.5" height="19" rx="1.25" fill="#2563eb"/>
  <text x="98" y="114" font-size="7" fill="#1e293b" text-anchor="middle"><tspan font-weight="bold" font-style="italic" font-family="Times New Roman, Times, serif">F(r)</tspan> = push apart if r &lt; <tspan fill="#2563eb" font-weight="bold">r₀</tspan> · zero at <tspan fill="#2563eb" font-weight="bold">r₀</tspan></text>
  <text x="98" y="121.5" font-size="7" fill="#1e293b" text-anchor="middle">pull back — weakening to fracture — if r &gt; <tspan fill="#2563eb" font-weight="bold">r₀</tspan></text>

  <!-- chips -->
  <rect x="12" y="130" width="80" height="11" rx="3" fill="#fefce8"/>
  <rect x="12" y="130" width="2.5" height="11" rx="1.25" fill="#d97706"/>
  <text x="19" y="137.5" font-size="7" font-weight="bold" fill="#b45309" letter-spacing="0.3">WORKED EXAMPLE</text>
  <rect x="97" y="130" width="74" height="11" rx="3" fill="#f0fdf4"/>
  <rect x="97" y="130" width="2.5" height="11" rx="1.25" fill="#16a34a"/>
  <text x="104" y="137.5" font-size="7" font-weight="bold" fill="#15803d" letter-spacing="0.3">KEY TAKEAWAYS</text>

  <text x="12" y="151.5" font-size="7" font-style="italic" fill="#475569">Plain-language reasoning builds into the governing equation.</text>

  <!-- ================= TRANSITION ================= -->
  <text x="97" y="168" font-size="7.5" font-weight="bold" fill="#64748b" text-anchor="middle">same idea, made tunable  ↓</text>

  <!-- ================= SECTION 2 HEADER ================= -->
  <circle cx="10" cy="176.5" r="5" fill="#2563eb"/>
  <text x="10" y="179.2" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="19" y="179.5" font-size="9" font-weight="bold" fill="#1e293b">Drive the simulation</text>
  <text x="116" y="179.5" font-size="7.5" fill="#94a3b8">test the model</text>

  <!-- ================= CARD 2 ================= -->
  <rect x="4" y="185" width="186" height="145" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.9"/>

  <!-- controls column -->
  <text x="12" y="196" font-size="7" font-weight="bold" fill="#94a3b8" letter-spacing="0.5">CONTROLS</text>

  <text x="12" y="206" font-size="7.5" font-weight="bold" fill="#1e293b">Separation</text>
  <text x="88" y="206" font-size="7.5" font-weight="bold" fill="#2563eb" text-anchor="end">1.07 × r₀</text>
  <line x1="12" y1="211.5" x2="88" y2="211.5" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="211.5" x2="54" y2="211.5" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <circle cx="54" cy="211.5" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1.3"/>

  <text x="12" y="221.5" font-size="7.5" font-weight="bold" fill="#1e293b">Bond strength</text>
  <text x="88" y="221.5" font-size="7.5" font-weight="bold" fill="#2563eb" text-anchor="end">1.0×</text>
  <line x1="12" y1="227" x2="88" y2="227" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="227" x2="37" y2="227" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <circle cx="37" cy="227" r="3.4" fill="#2563eb" stroke="#ffffff" stroke-width="1.3"/>

  <!-- scenario pills 2x2 -->
  <rect x="12" y="234" width="38" height="11" rx="5.5" fill="#ffffff" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="31" y="241.5" font-size="7" font-weight="bold" fill="#2563eb" text-anchor="middle">Squeezed</text>
  <rect x="53" y="234" width="33" height="11" rx="5.5" fill="#ffffff" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="69.5" y="241.5" font-size="7" font-weight="bold" fill="#2563eb" text-anchor="middle">Natural</text>
  <rect x="12" y="248" width="40" height="11" rx="5.5" fill="#2563eb"/>
  <text x="32" y="255.5" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">Stretched</text>
  <rect x="55" y="248" width="28" height="11" rx="5.5" fill="#ffffff" stroke="#93c5fd" stroke-width="0.9"/>
  <text x="69" y="255.5" font-size="7" font-weight="bold" fill="#2563eb" text-anchor="middle">Break</text>

  <!-- panel: the two atoms -->
  <rect x="94" y="190" width="88" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.9"/>
  <text x="99" y="199" font-size="7" font-weight="bold" fill="#94a3b8" letter-spacing="0.4">THE TWO ATOMS</text>
  <circle cx="116" cy="216" r="10.5" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 1.6"/>
  <circle cx="160" cy="216" r="10.5" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 1.6"/>
  <polyline points="123,216 126.4,216 129.2,212 132,220 134.8,212 137.6,220 140.4,212 143.2,220 146,212 148.8,220 151.2,216 153.2,216" fill="none" stroke="#1e3a5f" stroke-width="1.3" stroke-linejoin="round"/>
  <circle cx="116" cy="216" r="7" fill="url(#atom)" stroke="#1e3a5f" stroke-width="0.6" opacity="0.95"/>
  <circle cx="160" cy="216" r="7" fill="url(#atom)" stroke="#1e3a5f" stroke-width="0.6" opacity="0.95"/>
  <line x1="99" y1="216" x2="105" y2="216" stroke="#16a34a" stroke-width="1.6"/>
  <path d="M105 213.6 L109.5 216 L105 218.4 Z" fill="#16a34a"/>
  <line x1="177" y1="216" x2="171" y2="216" stroke="#16a34a" stroke-width="1.6"/>
  <path d="M171 213.6 L166.5 216 L171 218.4 Z" fill="#16a34a"/>

  <!-- panel: force vs separation -->
  <rect x="94" y="237" width="88" height="54" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.9"/>
  <text x="99" y="246" font-size="7" font-weight="bold" fill="#94a3b8" letter-spacing="0.4">FORCE–SEPARATION</text>
  <line x1="100" y1="250" x2="100" y2="286" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="100" y1="266" x2="178" y2="266" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="113.4" y1="252" x2="113.4" y2="286" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="2 1.6"/>
  <text x="116" y="257" font-size="7" font-style="italic" font-family="Times New Roman, Times, serif" fill="#64748b">r₀</text>
  <path d="M110.5 251.2 L110.8 253.4 L111.1 255.3 L111.4 257.2 L111.8 258.9 L112.1 260.5 L112.7 263.4 L113.4 265.9 L114.0 268.0 L114.6 269.8 L115.3 271.4 L116.2 273.3 L117.5 275.2 L119.1 276.7 L120.7 277.6 L122.3 277.9 L123.9 278.0 L125.5 277.7 L127.1 277.3 L128.7 276.8 L130.3 276.3 L131.9 275.7 L133.5 275.1 L135.1 274.5 L136.7 274.0 L138.3 273.4 L139.9 272.9 L141.5 272.4 L143.1 271.9 L144.7 271.5 L146.3 271.1 L147.9 270.7 L149.5 270.4 L151.1 270.0 L152.7 269.7 L154.3 269.5 L155.9 269.2 L157.5 269.0 L159.1 268.7 L160.7 268.5 L162.3 268.4 L163.9 268.2 L165.5 268.0 L167.1 267.9 L168.7 267.8 L170.3 267.6 L171.9 267.5 L173.5 267.4 L175.1 267.3 L176.7 267.2 L178.0 267.2" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="119.7" cy="277.1" r="2.8" fill="#16a34a" stroke="#ffffff" stroke-width="1"/>

  <!-- verdict -->
  <rect x="12" y="297" width="170" height="14" rx="3.5" fill="#f0fdf4" stroke="#86efac" stroke-width="0.9"/>
  <text x="18" y="306.5" font-size="7.5"><tspan font-weight="bold" fill="#15803d">✓ Correct</tspan><tspan fill="#1e293b"> — the bond now pulls back past r₀.</tspan></text>

  <text x="12" y="322" font-size="7" font-style="italic" fill="#475569">Move a slider — the picture and the self-check update live.</text>

  <!-- ================= TAKEAWAY BAR ================= -->
  <rect x="4" y="336" width="186" height="16" rx="5" fill="#1e3a5f"/>
  <text x="97" y="346.5" font-size="7.5" text-anchor="middle"><tspan font-weight="bold" fill="#93c5fd">Verify-then-trust</tspan><tspan fill="#ffffff"> — predict, then test by dragging.</tspan></text>
</svg>
