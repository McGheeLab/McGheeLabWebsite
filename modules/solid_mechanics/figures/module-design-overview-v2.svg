  <text x="8" y="15" font-size="7.5" font-weight="bold" fill="#ffffff">Atoms as Springs — Why Materials Stretch</text>
  <text x="8" y="25" font-size="7" fill="#ffffff" opacity="0.85">Solid Mechanics · Lesson 1 of 5 · browser-based</text>

