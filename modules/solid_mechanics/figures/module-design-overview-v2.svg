  <rect x="10" y="99" width="88" height="28" rx="2" fill="#eff6ff"/>
  <rect x="10" y="99" width="2" height="28" fill="#2563eb"/>
  <text x="55" y="111" font-size="8" font-style="italic" font-family="Times New Roman, Times, serif" fill="#1e293b" text-anchor="middle">F = −k x,   x = r − r₀</text>
  <text x="55" y="122" font-size="7" font-style="italic" font-family="Times New Roman, Times, serif" fill="#1e293b" text-anchor="middle">U(r) = 4ε[(σ/r)<tspan dy="-2.5" font-size="5">12</tspan><tspan dy="2.5" font-size="7"> − (σ/r)</tspan><tspan dy="-2.5" font-size="5">6</tspan><tspan dy="2.5" font-size="7">]</tspan></text>

  <!-- worked example / key takeaways chips -->
  <rect x="10" y="132" width="88" height="11" rx="1.5" fill="#fefce8"/>
  <rect x="10" y="132" width="2" height="11" fill="#d97706"/>
