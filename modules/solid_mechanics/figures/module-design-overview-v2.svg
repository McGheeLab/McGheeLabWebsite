  <text x="10" y="78" font-size="7" font-weight="bold" fill="#1e3a5f">Background: two atoms, one tug-of-war</text>
  <rect x="10" y="83" width="176" height="2.5" rx="1.25" fill="#cbd5e1"/>
  <rect x="10" y="88" width="168" height="2.5" rx="1.25" fill="#cbd5e1"/>
  <rect x="10" y="93" width="120" height="2.5" rx="1.25" fill="#cbd5e1"/>

