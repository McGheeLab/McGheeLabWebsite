  <text x="72" y="266" font-size="7" fill="#1e293b" text-anchor="end">−1.1 ε/σ</text>
  <text x="14" y="274" font-size="7" fill="#64748b">stiff. k</text>
  <text x="72" y="274" font-size="7" fill="#1e293b" text-anchor="end">57 ε/σ²</text>
  <text x="14" y="282" font-size="7" fill="#64748b">energy U</text>
  <text x="72" y="282" font-size="7" fill="#1e293b" text-anchor="end">−0.30 ε</text>

