  <rect x="10" y="147" width="88" height="11" rx="1.5" fill="#f0fdf4"/>
  <rect x="10" y="147" width="2" height="11" fill="#16a34a"/>
  <text x="16" y="154.5" font-size="7" font-style="italic" fill="#15803d">key takeaways</text>
