  <text x="21" y="68" font-size="7" font-weight="bold" fill="#1e3a5f">LEARN THE MATHEMATICS</text>
  <text x="186" y="68" font-size="7" font-style="italic" fill="#64748b" text-anchor="end">build the model</text>

