<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>McGhee Lab — RM Home</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/workflow.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script src="/rm/js/icons.js"></script>
</head>
<body>
  <!-- V3.809 — RM Home is ONE scrolling page (the V3.74 Workflows | All
       Pages tab toggle is gone):
         My Lab Today  (home-feed.js inserts #rm-home-feed above #rm-home-root)
         Jump back in  (home.js — pinned + recent pages, same stores as the bar)
         Workflows     (workflow-chooser.js)
         All pages     (all-pages.js — grouped tiles + filter + ★ pin)
       ?view=all-pages / #all-pages / #workflows / #new-workflow still work
       (home.js + workflow-chooser.js). -->
  <div class="page wf-page home-page">
    <div class="page-header">
      <h1 class="page-title" id="rm-home-title">Home</h1>
      <div class="home-header-actions">
        <button type="button" class="btn home-search-btn" id="home-search-btn" title="Find any page">
          Find a page… <kbd>⌘K</kbd>
        </button>
        <a class="btn" href="/rm/pages/lab-overview.html">Lab Overview Stats →</a>
      </div>
    </div>
    <div id="rm-home-root">
      <section class="home-section" id="home-jump" aria-labelledby="home-jump-title">
        <div class="home-section-head">
          <h2 class="wf-section-title" id="home-jump-title">Jump back in</h2>
          <p class="wf-section-sub">Your pinned pages, then the ones you open most. These are also the chips in the bar above.</p>
        </div>
        <div class="home-jump-grid" id="home-jump-grid"><div class="home-jump-empty">Loading…</div></div>
      </section>

      <section class="home-section" id="home-workflows" aria-label="Workflows">
        <div class="empty-state">Loading workflows…</div>
      </section>

      <section class="home-section" id="home-all-pages" aria-labelledby="home-pages-title">
        <div class="home-section-head">
          <h2 class="wf-section-title" id="home-pages-title">All pages</h2>
          <input type="search" class="home-pages-filter" id="home-pages-filter" placeholder="Filter pages… (Enter opens the first match)" aria-label="Filter pages">
        </div>
        <div id="home-pages-grid"><div class="empty-state">Loading…</div></div>
        <div id="home-pages-empty" class="home-jump-empty" hidden></div>
      </section>
    </div>
  </div>
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/nav.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/chat-alert-watch.js" defer></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/rm-dialog.js"></script>
  <script src="/rm/js/local-cache.js"></script>
  <script src="/rm/js/sync-status.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/page-registry.js"></script>
  <script src="/rm/js/page-collections.js"></script>
  <script src="/rm/js/workflow-state.js"></script>
  <script src="/rm/js/all-pages.js"></script>
  <script src="/rm/js/workflow-chooser.js"></script>
  <script src="/rm/js/home.js"></script>
  <script src="/rm/js/home-feed.js"></script>
  <script src="/rm/js/huddle-badge.js"></script>
</body>
</html>
