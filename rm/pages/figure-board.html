  <title>Figure board — McGhee Lab</title>
  <!-- V3.837 — a paper's figure board on the canvas engine (the same system
       as the lab notebook: the sheet is the board, radial pills carry the
       tools, cards are widgets). ?paper=<id>; &embed=1 when the paper
       builder's Figures tab shows it in an iframe. Drawn regions become
       panels (⬚ Region → Make panel), cards connect with arrows, a lit
       review from a notebook brings its papers along. Data:
       papers/{paperId}/boards/main. -->
