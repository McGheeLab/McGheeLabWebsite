<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMR — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/activity-signals.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script src="/rm/js/icons.js"></script>
  <style>
    /* ── Page chrome ──────────────────────────────────────────── */
    .pmr-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .pmr-toolbar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;font-weight:600}
    .pmr-toolbar select,.pmr-toolbar input,.pmr-toolbar button{font-size:13px;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
    .pmr-toolbar button.primary{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:500}
    .pmr-toolbar .status-pill{font-size:11px;padding:3px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
    .pmr-toolbar .status-pill.draft{background:#f3f4f6;color:#6b7280}
    .pmr-toolbar .status-pill.submitted{background:#fef3c7;color:#92400e}
    .pmr-toolbar .status-pill.discussed{background:#dbeafe;color:#1e40af}
    .pmr-toolbar .status-pill.archived{background:#e5e7eb;color:#374151}
    .pmr-toolbar .grow{flex:1 1 auto}

    /* ── Layout: left rail (student picker, admin only) + body ── */
    .pmr-layout{display:grid;grid-template-columns:240px 1fr;gap:16px}
    .pmr-layout.no-rail{grid-template-columns:1fr}
    .pmr-rail{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 0;max-height:calc(100vh - 220px);overflow-y:auto;position:sticky;top:120px}
    .pmr-rail h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;font-weight:600;margin:0 0 6px 0;padding:0 14px}
    .pmr-rail .person{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;font-size:13px;color:#1f2937;border-left:3px solid transparent}
    .pmr-rail .person:hover{background:#f9fafb}
    .pmr-rail .person.active{background:#eff6ff;border-left-color:#2563eb;font-weight:500}
    .pmr-rail .person .avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;flex-shrink:0}
    .pmr-rail .person .role{margin-left:auto;font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.3px}

    .pmr-body{min-width:0}

    /* ── Block frames ─────────────────────────────────────────── */
    .pmr-block{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .pmr-block h2{margin:0 0 10px 0;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#374151;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .pmr-block h2 .pmr-help{font-size:11px;color:#9ca3af;text-transform:none;letter-spacing:0;font-weight:400}

    /* ── Reference links list ──────────────────────────────────── */
    .pmr-ref-row{display:grid;grid-template-columns:120px 1fr 1fr 28px;gap:8px;align-items:center;margin-bottom:6px}
    .pmr-ref-row select,.pmr-ref-row input{font-size:13px;padding:5px 8px;border:1px solid #e5e7eb;border-radius:5px;width:100%}
    .pmr-ref-row .del{cursor:pointer;color:#dc2626;text-align:center;font-size:14px;padding:4px;user-select:none}
    .pmr-ref-row .del:hover{background:#fee2e2;border-radius:4px}
    .pmr-add-btn{font-size:12px;color:#2563eb;background:none;border:none;padding:4px 0;cursor:pointer;text-decoration:underline;margin-top:4px}

    /* ── Project overview table ────────────────────────────────── */
    .pmr-proj-table{width:100%;border-collapse:collapse;font-size:13px}
    .pmr-proj-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;font-weight:600;padding:6px 8px;border-bottom:1px solid #e5e7eb}
    .pmr-proj-table td{padding:8px;vertical-align:top;border-bottom:1px solid #f3f4f6}
    .pmr-proj-table input,.pmr-proj-table select,.pmr-proj-table textarea{font-size:13px;padding:5px 8px;border:1px solid #e5e7eb;border-radius:5px;width:100%;font-family:inherit}
    .pmr-proj-table textarea{resize:vertical;min-height:32px}
    .pmr-status-pill{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:10px}
    .pmr-status-pill.good{background:#dcfce7;color:#166534}
    .pmr-status-pill.behind{background:#fef3c7;color:#92400e}
    .pmr-status-pill.delayed{background:#fee2e2;color:#991b1b}
    .pmr-status-pill.paused{background:#e5e7eb;color:#374151}

    /* ── Weekly entries ─────────────────────────────────────────── */
    .pmr-week{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fafbfc}
    .pmr-week-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:500}
    .pmr-week-head input[type="date"]{font-size:12px;padding:3px 6px;border:1px solid #d1d5db;border-radius:4px;background:#fff}
    .pmr-week-head .dash{color:#9ca3af}
    .pmr-week-head .del{margin-left:auto;cursor:pointer;color:#dc2626;font-size:14px;padding:2px 8px}
    .pmr-section{margin:8px 0 4px 0}
    .pmr-section-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}
    .pmr-section-head input{font-size:12px;padding:2px 6px;border:1px solid transparent;background:transparent;border-radius:4px;font-weight:600;color:#374151;flex:1}
    .pmr-section-head input:focus{border-color:#d1d5db;background:#fff}
    .pmr-section-head .del{cursor:pointer;color:#dc2626;font-size:13px;padding:2px 6px}
    .pmr-item{display:grid;grid-template-columns:90px 1fr 28px;gap:6px;align-items:center;margin-bottom:3px;padding-left:12px}
    .pmr-item select{font-size:11px;padding:2px 4px;border:1px solid #e5e7eb;border-radius:4px;font-weight:500}
    .pmr-item select.s-done{background:#dcfce7;color:#166534}
    .pmr-item select.s-in_progress{background:#dbeafe;color:#1e40af}
    .pmr-item select.s-postponed{background:#e5e7eb;color:#374151}
    .pmr-item select.s-need{background:#fee2e2;color:#991b1b}
    .pmr-item input[type="text"]{font-size:13px;padding:3px 6px;border:1px solid transparent;background:transparent;border-radius:4px;width:100%}
    .pmr-item input[type="text"]:focus{border-color:#d1d5db;background:#fff}
    .pmr-item .del{cursor:pointer;color:#dc2626;text-align:center;font-size:13px;padding:2px}
    .pmr-item .del:hover{background:#fee2e2;border-radius:4px}
    /* V3.541 — weekly focus review block (derived, read-only) */
    .pmr-fr-month{font-size:12px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
    .pmr-fr-week{margin-bottom:8px}
    .pmr-fr-weekhead{font-size:11px;color:#6b7280;font-weight:600;margin-bottom:4px}
    .pmr-fr-card{border:1px solid #e5e7eb;border-left:3px solid #2563eb;border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fafbfc}
    .pmr-fr-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .pmr-fr-title{font-weight:600;font-size:13px}
    .pmr-fr-chip{font-size:10px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
    .pmr-fr-outcome{font-size:12px;font-weight:600}
    .pmr-fr-tasks{font-size:11px;color:#6b7280}
    .pmr-fr-desc{font-size:12px;color:#6b7280;margin-top:2px}
    .pmr-fr-summary{font-size:12px;color:#374151;margin-top:2px;font-style:italic}
    .pmr-fr-nb{font-size:11px}

    /* V3.517 — read-only lab-notebook entries surfaced under each week */
    .pmr-week-notebook{margin:8px 0 2px 0;padding:8px 0 2px 12px;border-top:1px dashed #e5e7eb}
    .pmr-wn-head{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
    .pmr-wn-item{border-radius:6px;margin-bottom:2px}
    .pmr-wn-row{display:flex;align-items:center;gap:8px;padding:4px 6px;cursor:pointer;border-radius:6px;font-size:13px}
    .pmr-wn-row:hover{background:#f1f5f9}
    .pmr-wn-twist{color:#9ca3af;font-size:10px;width:10px;flex:none}
    .pmr-wn-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#111827;font-weight:500}
    .pmr-wn-date{color:#9ca3af;font-size:11px;flex:none;font-variant-numeric:tabular-nums}
    .pmr-wn-pill{font-size:10px;padding:1px 7px;border-radius:999px;flex:none;background:#e5e7eb;color:#374151;text-transform:capitalize}
    .pmr-wn-pill.s-running{background:#fef3c7;color:#92400e}
    .pmr-wn-pill.s-complete{background:#dcfce7;color:#166534}
    .pmr-wn-pill.s-plan{background:#e0e7ff;color:#3730a3}
    .pmr-wn-pill.s-closed{background:#dcfce7;color:#166534}
    .pmr-wn-pill.s-archived{background:#e5e7eb;color:#6b7280}
    .pmr-wn-open{font-size:11px;color:#2563eb;text-decoration:none;flex:none;padding:1px 4px}
    .pmr-wn-open:hover{text-decoration:underline}
    .pmr-wn-body{margin:2px 0 8px 24px;padding:8px 12px;border-left:2px solid #e5e7eb;background:#fff;border-radius:0 6px 6px 0;max-height:420px;overflow:auto}
    .pmr-wn-summary{font-size:12px;font-style:italic;color:#6b7280;margin-bottom:6px}
    .pmr-wn-rich{font-size:13px;line-height:1.55;color:#1f2937;word-wrap:break-word;overflow-wrap:anywhere}
    .pmr-wn-rich img{max-width:100%;height:auto;border-radius:6px;margin:6px 0}
    .pmr-wn-rich table{border-collapse:collapse;max-width:100%}
    .pmr-wn-rich td,.pmr-wn-rich th{border:1px solid #e5e7eb;padding:3px 6px}

    /* ── Discussion / next steps ───────────────────────────────── */
    .pmr-disc-card{border:1px solid #e5e7eb;border-left:4px solid #2563eb;border-radius:6px;padding:8px 10px;margin-bottom:8px;background:#fff;display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:flex-start}
    .pmr-disc-card.kind-blocker{border-left-color:#dc2626}
    .pmr-disc-card.kind-next_action{border-left-color:#16a34a}
    .pmr-disc-card.kind-idea{border-left-color:#7c3aed}
    .pmr-disc-card select{font-size:12px;padding:3px 6px;border:1px solid #e5e7eb;border-radius:4px}
    .pmr-disc-card textarea{font-size:13px;padding:4px 6px;border:1px solid #e5e7eb;border-radius:5px;min-height:36px;resize:vertical;font-family:inherit;width:100%}
    .pmr-disc-card .actions{display:flex;flex-direction:column;gap:3px}
    .pmr-disc-card .actions button{font-size:11px;padding:3px 6px;border:1px solid #e5e7eb;border-radius:4px;background:#fff;cursor:pointer}

    .pmr-empty{text-align:center;padding:30px 20px;color:#9ca3af;font-size:13px}
    .pmr-loading{padding:20px;color:#6b7280;font-size:13px}

    /* V3.161 — Figure reviews block + lightbox. */
    .pmr-fig-review-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:8px}
    .pmr-fig-review-card{background:#fff;border:1px solid #e5e7eb;border-left:4px solid #f59e0b;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04)}
    .pmr-fig-review-imgbox{position:relative;background:#f9fafb;border-radius:6px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
    .pmr-fig-review-img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;background:#fff}
    .pmr-fig-review-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
    .pmr-fig-review-meta a{color:#1d4ed8;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pmr-fig-review-meta a:hover{text-decoration:underline}
    .pmr-fig-review-stamp{color:#9ca3af;font-size:11px;white-space:nowrap}
    .pmr-fig-review-caption{font-size:13px;padding:6px 8px;border:1px solid transparent;border-radius:6px;min-height:36px;line-height:1.4;color:#1f2937}
    .pmr-fig-review-caption[contenteditable=true]{background:#fffbeb;border-color:#fde68a}
    .pmr-fig-review-caption[contenteditable=true]:focus{outline:none;border-color:#f59e0b;background:#fff}
    .pmr-fig-review-caption:empty:before{content:attr(data-placeholder);color:#9ca3af;font-style:italic}
    .pmr-fig-review-actions{display:flex;justify-content:space-between;gap:6px}
    .pmr-fig-review-remove{color:#991b1b !important;border-color:#fca5a5 !important}
    .pmr-fig-review-remove:hover{background:#fef2f2 !important}

    .pmr-fig-lightbox{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
    .pmr-fig-lightbox-img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:6px;box-shadow:0 20px 60px -10px rgba(0,0,0,0.5)}
    .pmr-fig-lightbox-label{margin-top:12px;color:#f9fafb;font-size:13px;max-width:90vw;text-align:center}
    /* V3.624 — My Week ledger block */
    .pmr-lg-refresh{float:right;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;color:#6b7280;padding:2px 8px;cursor:pointer}
    .pmr-lg-week{border:1px solid #eef0f4;border-radius:8px;padding:8px 10px;margin:8px 0;background:#fafbfc}
    .pmr-lg-weekhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
    .pmr-lg-range{font-weight:600;font-size:12px;color:#374151}
    .pmr-lg-chip{font-size:11px;border:1px solid #e5e7eb;border-radius:999px;padding:1px 8px;background:#fff;color:#6b7280}
    .pmr-lg-golink{margin-left:auto;font-size:11px;color:#2563eb;text-decoration:none}
    .pmr-lg-item{display:flex;gap:8px;padding:5px 0;border-top:1px dashed #eef0f4}
    .pmr-lg-item:first-of-type{border-top:none}
    .pmr-lg-icon{flex:0 0 auto;font-size:13px}
    .pmr-lg-main{min-width:0;flex:1}
    .pmr-lg-title{font-size:13px;color:#1f2937}
    .pmr-lg-day{font-size:11px;color:#9ca3af;margin-left:6px}
    .pmr-lg-bits{font-size:11px;color:#6b7280;margin-left:8px}
    .pmr-lg-outcome{font-size:12px;color:#6b7280;margin-top:2px}
    .pmr-lg-oc-result{color:#166534}
    .pmr-lg-oc-barrier{color:#92400e}
    .pmr-lg-oc-missing{color:#b45309}
    .pmr-lg-missing{background:#fffbeb;border-radius:6px;padding-left:4px;padding-right:4px}
    .pmr-lg-img{font-size:11px;color:#2563eb;text-decoration:none;margin-left:6px}
    .pmr-lg-thumb{height:18px;width:auto;max-width:36px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:3px;border:1px solid #e5e7eb} /* V3.853 — the card a result points at */
    .pmr-lg-fu{font-size:11px;color:#6b7280}
    .pmr-lg-more{margin-top:6px;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;color:#374151;padding:4px 10px;cursor:pointer}
    /* V3.626 — per-week presence dots (Mon→Sun, from tracker events) */
    .pmr-lg-presence{display:inline-flex;gap:2px;align-items:center}
    .pmr-lg-pd{width:7px;height:7px;border-radius:50%;background:#e5e7eb}
    .pmr-lg-pd.on{background:#16a34a}
    .pmr-lg-pd.future{background:transparent;border:1px dashed #e5e7eb}
    /* V3.625 — My projects health header */
    .pmr-ph-card{border:1px solid #eef0f4;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
    .pmr-ph-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .pmr-ph-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
    .pmr-ph-dot.healthy{background:#16a34a}
    .pmr-ph-dot.attention{background:#f59e0b}
    .pmr-ph-dot.stuck{background:#dc2626}
    .pmr-ph-title{font-weight:600;font-size:14px;color:#111827;text-decoration:none}
    .pmr-ph-trend{font-size:13px}
    .pmr-ph-why{font-size:12px;color:#6b7280;flex-basis:100%}
    .pmr-ph-strip{display:flex;gap:3px;margin-top:6px}
    .pmr-ph-wk{width:18px;height:18px;border-radius:4px;border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-size:10px;background:#fafbfc}
    .pmr-ph-desc{width:100%;margin-top:6px;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;padding:4px 8px;color:#374151}
    .pmr-ph-expand{font-size:11px;border:none;background:none;color:#2563eb;cursor:pointer;padding:2px 0}
    .pmr-ph-detail{margin-top:6px;border-top:1px dashed #eef0f4;padding-top:6px}
    .pmr-ph-accept{font-size:11px;border:1px solid #16a34a;color:#166534;background:#f0fdf4;border-radius:999px;padding:1px 8px;cursor:pointer;margin-left:6px}
    .pmr-ph-accepted{font-size:11px;color:#166534;margin-left:6px}
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1 class="page-title">PMR — Project Management Report</h1>
      <div class="pmr-toolbar">
        <span class="lbl">Period</span>
        <select id="pmr-period"></select>
        <button id="pmr-new" title="Create a new PMR for a different period">+ New period</button>
        <!-- V3.323 — archived periods stay out of the select unless toggled. -->
        <button id="pmr-show-archived" style="display:none" title="Show archived periods in the list"></button>
        <span class="grow"></span>
        <!-- V3.323 — optional 1:1 meeting date on the period doc (feeds FuturePlan 05 reminders). -->
        <label id="pmr-meeting-wrap" style="display:none;font-size:11px;color:#6b7280;align-items:center;gap:4px"><i data-hi="calendar-days"></i> 1:1
          <input type="date" id="pmr-meeting-date" style="font-size:12px;padding:3px 6px;border:1px solid #d1d5db;border-radius:6px">
        </label>
        <span id="pmr-status-pill" class="status-pill draft">draft</span>
        <button id="pmr-archive" style="display:none" title="Archive this period — hides it from the period list"></button>
        <button id="pmr-submit" class="primary" title="Mark as submitted for 1:1 discussion">Submit for 1:1</button>
        <span id="pmr-saving" style="font-size:11px;color:#9ca3af"></span>
      </div>
    </div>
    <div id="pmr-content" class="pmr-loading">Loading…</div>
  </div>
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/nav.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <!-- V3.157 — Storage SDK powers barrier figure uploads via paper-figures.js. -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/chat-alert-watch.js" defer></script>
  <script src="/rm/js/activity-signals.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <!-- V3.157 — barriers paste-image upload, threaded comments, and admin-side task assignment. -->
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/paper-figures.js"></script>
  <script src="/rm/js/task-assign.js"></script>
  <script src="/rm/js/section-comments.js"></script>
  <!-- V3.194 — bridge to Tasks-page subtasks (Add to PMR + completion sync). -->
  <script src="/rm/js/task-pmr-sync.js"></script>
  <!-- V3.532 — "⤓ Assemble" pulls the week's notebook/tracker/tasks/My Week
       work into weekly entries (notebook is canonical; PMR is curated). -->
  <script src="/rm/js/pmr-week-assemble.js"></script>
  <!-- V3.541 — weekly focus review block (mentor↔mentee focus loop rollup) -->
  <!-- V3.602 — a weekly focus can align to a specific roadmap ANALYSIS;
       focus-areas.js reads roadmaps through ROADMAP_DATA and mirrors the
       pick into roadmapClaims, so this must load first. -->
  <script src="/rm/js/roadmap-data.js"></script>
  <script src="/rm/js/focus-areas.js"></script>
  <!-- V3.625 — "My projects" health header: research-data lists the foci
       cards, project-health scores them from the My Week outcome ledger. -->
