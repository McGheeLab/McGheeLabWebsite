  <title>Lab Notebook — McGhee Lab</title>
  <!-- V3.833/V3.837 — the CANVAS lab notebook (Scientia plan). An entry is
       a board: the sheet is the notebook (pen, continuous scroll, 🎙
       recording + replay, ＋ From paper) and everything else is a widget
       card from the ＋ pill — typed note, checklist, calculator, protocol
       followed, inventory item, figure, paper quote. Scientia's frame: a
       title line, the entries as tabs grouped by notebook, the sheet
       filling the rest, ⛶ full screen. The classic editor and the block
       view are retired (both redirect here). Data: userData/{uid}/notebook/
       {entryId} + _index, userData/{uid}/notebooks, userData/{uid}/notebookBoards. -->
