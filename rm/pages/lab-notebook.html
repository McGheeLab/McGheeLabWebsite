<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Notebook — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/lab-notebook.css">
  <link rel="stylesheet" href="/rm/css/activity-signals.css">
  <script src="/rm/js/runtime-mode.js"></script>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Lab Notebook</h1>
    </div>
    <div id="ln-content" class="ln-loading">Loading…</div>
  </div>

  <!--
    Hidden inputs for the upload pipeline. The 📷 Capture button on
    phones opens the rear camera directly via capture="environment";
    the 📎 Attach button is the standard file picker.
  -->
  <input type="file" id="ln-camera-input" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="ln-file-input"  accept="image/*,application/pdf" multiple style="display:none">

  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/nav.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/activity-signals.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/notebook-schemas.js"></script>
  <script src="/rm/js/notebook-figures.js"></script>
  <script src="/rm/js/external-links.js"></script>
  <script src="/rm/js/lab-notebook.js"></script>
</body>
</html>
