<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Meetings — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/meetings.css">
  <link rel="stylesheet" href="/rm/css/activity-signals.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script src="/rm/js/icons.js"></script>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Lab Meetings</h1>
    </div>
    <div id="mtg-root"></div>
  </div>

  <!-- Firebase SDK (no Storage: slides live as Google Drive links since V3.743) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

  <!-- RM auth + adapter + cache + nav -->
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/chat-alert-watch.js" defer></script>
  <script src="/rm/js/activity-signals.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/local-cache.js"></script>
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/sync-status.js"></script>
  <script src="/rm/js/nav.js"></script>

  <!-- Feature deps — order matters:
       app-sheet   → every form/picker/confirm on this page is a sheet (house rule: no browser popups)
       task-assign → writeTaskFor(): action items + chores become tasks on the assignee's My Week
       drive-link  → parse/verify/card for Google Drive slide links
       live/chores → read window.MEETINGS, so they load BEFORE meetings.js publishes it? No —
                     they only touch it inside functions called after boot, so either order works;
                     kept before the renderer so their globals exist on first render. -->
  <script src="/rm/js/app-sheet.js"></script>
  <script src="/rm/js/task-assign.js"></script>
  <script src="/rm/js/drive-link.js"></script>
  <script src="/rm/js/meetings-live.js"></script>
  <script src="/rm/js/meetings-chores.js"></script>
  <script src="/rm/js/meetings-one-on-one.js"></script>

  <!-- Page renderer -->
  <script src="/rm/js/meetings.js"></script>
</body>
</html>
