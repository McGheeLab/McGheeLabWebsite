<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/activity-signals.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script>
    /* V3.62 — unified Activity hub. The five activity-related pages
     * (activity-overview / activity-tracker / year-review /
     * email-review / activity-summary) collapse into one tab-aware
     * shell selected by ?tab=<name>. Each tab has its own DOM block,
     * its own inline CSS link, and its own per-tab renderer scripts —
     * loaded via document.write so only the active tab boots. The
     * inactive tabs' DOM is also in the shell but hidden via CSS so
     * renderer queries don't accidentally cross-pollinate. */
    (function () {
      var validTabs = ['overview', 'tracker', 'timeline', 'email', 'lab-stats'];
      var t = new URLSearchParams(location.search).get('tab') || 'overview';
      if (validTabs.indexOf(t) === -1) t = 'overview';
      window.__ACT_TAB = t;
      var TITLES = {
        'overview':  'Activity Overview — McGhee Lab',
        'tracker':   'Activity Tracker — McGhee Lab',
        'timeline':  'Year in Review — McGhee Lab',
        'email':     'Email Review — McGhee Lab',
        'lab-stats': 'Lab Activity — McGhee Lab'
      };
      document.title = TITLES[t];
      document.documentElement.dataset.actTab = t;
    })();
  </script>
  <!-- Per-tab stylesheets — all loaded eagerly. Each is scoped to its
       prefix (cx-*, jp-*, act-* / yr-* / ch-*/er-*/disp-* / etc) so
       loading them all together is harmless. The activity-tracker.css
       file is shared with the deferred-tracker view. -->
  <link rel="stylesheet" href="/rm/css/activity-overview.css">
  <link rel="stylesheet" href="/rm/css/year-review.css">
  <link rel="stylesheet" href="/rm/css/email-review.css">
  <link rel="stylesheet" href="/rm/css/activity-tracker.css">
  <style>
    /* Tab-driven block visibility — only the active tab's block is
       displayed. CSS rules use `html[data-act-tab]` so the inactive
       blocks are hidden before first paint. */
    html[data-act-tab="overview"]  .act-tab:not(.tab-overview)  { display: none; }
    html[data-act-tab="tracker"]   .act-tab:not(.tab-tracker)   { display: none; }
    html[data-act-tab="timeline"]  .act-tab:not(.tab-timeline)  { display: none; }
    html[data-act-tab="email"]     .act-tab:not(.tab-email)     { display: none; }
    html[data-act-tab="lab-stats"] .act-tab:not(.tab-lab-stats) { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <!-- V3.69 — in-page tab bar removed; tabs are selected via ?tab=<name>
         and the workflow strip / regular Activity dropdown handle nav.
         V3.71 — activity-subnav.js (the pill bar) also retired since
         workflows have fully replaced its purpose. -->

    <!-- ===== Overview tab (default) ===== -->
    <div class="act-tab tab-overview">
      <div class="page-header">
        <h1 class="page-title">Activity Overview</h1>
      </div>

      <!-- Action bar — local-only buttons (Outlook + Gmail scrapers,
           Claude API suggester) hidden on the static deploy. -->
      <div class="act-actions local-only">
        <button class="btn btn-primary" id="btn-import" title="Fast: pull new Outlook + Gmail mail and scrape calendar into the raw archive. No ML, no clustering.">
          <span id="btn-import-label">Import</span>
        </button>
        <button class="btn btn-primary" id="btn-process" title="Slow: index + dedupe mail, run the ML category classifier on mail and calendar, rebuild activity clusters. No LLM calls.">
          <span id="btn-process-label">Process</span>
        </button>
        <button class="btn" id="btn-suggest" title="Opens the API Usage page: previews cost, shows live progress, and lets you stop mid-run.">Plan suggester run…</button>
        <span id="act-status" class="act-status"></span>
      </div>

      <div class="job-progress" id="job-progress"></div>

      <div class="act-section-title">At a glance</div>
      <div class="act-stats" id="act-stats">Loading…</div>

      <div class="act-section-title">Jump to</div>
      <div class="act-tiles" id="act-tiles"></div>

      <div class="act-section-title">Category Explorer</div>
      <div class="cx-wrap">
        <div class="cx-header">
          <input type="text" id="cx-search" class="cx-search" placeholder="Search categories, sub-categories, or item titles…">
          <span class="cx-counts" id="cx-counts">loading…</span>
          <button type="button" id="cx-split-btn" class="btn btn-sm" title="Fullscreen Compare: expand the explorer and show the pinned drop target on the right">Fullscreen Compare</button>
          <button type="button" id="cx-expand-btn" class="btn btn-sm" title="Expand to fullscreen — Esc to exit">⤢ Expand</button>
          <button type="button" id="cx-add-btn" class="btn btn-sm btn-primary" title="Add a new sub-category that has no items yet">+ Add sub-category</button>
        </div>
        <div class="cx-pills" id="cx-pills"></div>
        <div class="cx-bulkbar" id="cx-bulkbar" style="display:none"></div>
        <div class="cx-split" id="cx-split">
          <div class="cx-list" id="cx-list"></div>
          <div class="cx-split-divider" id="cx-split-divider" style="display:none">
            <button type="button" id="cx-move-arrow" class="cx-move-arrow" disabled
                    title="Move selected items to the pinned target">→</button>
            <div class="cx-move-arrow-hint" id="cx-move-arrow-hint"></div>
          </div>
          <div class="cx-split-right" id="cx-split-right" style="display:none"></div>
        </div>
      </div>

      <div class="act-section-title">Recent activity</div>
      <div class="act-recent" id="act-recent"></div>
    </div>

    <!-- ===== Tracker tab ===== -->
    <div class="act-tab tab-tracker">
      <div class="page-header">
        <h1 class="page-title">Activity Tracker</h1>
      </div>
      <div id="tracker-root"></div>
    </div>

    <!-- ===== Year Timeline tab ===== -->
    <div class="act-tab tab-timeline">
      <div class="page-header">
        <h1 class="page-title">Year in Review</h1>
        <div class="yr-toolbar">
          <select id="yr-year" class="btn" style="font-size:14px"></select>
          <button id="yr-refresh" class="btn" style="font-size:13px">Rebuild</button>
          <label style="font-size:12px;color:#374151;display:inline-flex;align-items:center;gap:6px;margin-left:8px;user-select:none">
            <input type="checkbox" id="yr-show-future"> show future
          </label>
          <span id="yr-status" style="font-size:12px;color:#6b7280"></span>
        </div>
      </div>
      <!-- V3.72 — #content is appended dynamically by the inline script
           below (matches the email + lab-stats tabs). Previously this
           tab had a hardcoded <div id="content"> that won the
           getElementById('content') lookup even when the email tab was
           active, causing renderEmails() to write into a hidden div
           and the user to see a blank inbox. -->
    </div>

    <!-- ===== Email Review tab ===== -->
    <div class="act-tab tab-email">
      <div class="page-header">
        <h1 class="page-title">Email Review</h1>
      </div>
      <div class="ch-toolbar">
        <select id="year-filter" class="btn" style="font-size:14px"></select>
        <button class="btn btn-sm btn-primary" id="email-scrape-now-btn" type="button" title="Fetch new messages from your connected Gmail account">Scrape now</button>
        <label style="font-size:12px;color:#374151;display:inline-flex;align-items:center;gap:4px;user-select:none" title="How many days back this scrape should reach — raise it if you haven't synced in a while and missed mail">
          <input type="number" id="email-scrape-days" min="1" max="3650" value="7" style="width:58px;font-size:13px;padding:3px 6px;border:1px solid #d1d5db;border-radius:6px">
          days back
        </label>
        <span id="email-scrape-status" style="font-size:12px;color:#6b7280"></span>
        <label style="font-size:12px;color:#374151;display:inline-flex;align-items:center;gap:6px;margin-left:auto;user-select:none">
          <input type="checkbox" id="only-tasks"> only with tasks
        </label>
        <button class="btn btn-sm" id="email-trash-btn" type="button">Trash</button>
      </div>
      <div id="year-review" class="ch-summary"></div>
      <div id="cat-toggles" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
      <div id="email-analytics" class="ch-analytics">
        <div class="ch-panel">
          <h3 id="timeline-title">Monthly email volume by category</h3>
          <div class="ch-timeline-wrap"><canvas id="timeline-chart"></canvas></div>
        </div>
        <div class="ch-panel">
          <h3>Top activities by volume</h3>
          <div id="activity-rollup"></div>
        </div>
      </div>
      <div class="ch-toolbar" id="email-events-toolbar">
        <input type="text" id="search-box" class="btn" placeholder="search subject / sender / activity / category path (e.g. research:grant:onr)" style="font-size:14px;min-width:240px;flex:1;max-width:480px">
        <select id="sort-by" class="btn" style="font-size:13px" title="Sort emails">
          <option value="date-desc">Newest first</option>
          <option value="date-asc">Oldest first</option>
          <option value="predicted-desc">Predicted importance &#9733;</option>
          <option value="rating-desc">My rating &#9733;</option>
        </select>
        <button class="btn btn-sm" id="select-mode-btn" type="button" title="Toggle multi-select mode">Select</button>
        <span id="result-count" style="margin-left:auto;font-size:12px;color:#6b7280"></span>
      </div>
      <div class="em-bulk-bar" id="em-bulk-bar">
        <span class="em-bulk-count" id="em-bulk-count">0 selected</span>
        <button class="em-bulk-btn" id="em-bulk-select-all" type="button">Select visible</button>
        <button class="em-bulk-btn" id="em-bulk-clear" type="button">Clear</button>
        <span style="flex:1"></span>
        <button class="em-bulk-btn bb-actionable" data-disp="actionable" type="button">
          <span class="shape">&#9679;</span> Actionable
        </button>
        <button class="em-bulk-btn bb-reminder" data-disp="reminder" type="button">
          <span class="shape">&#9650;</span> Reminder
        </button>
        <button class="em-bulk-btn bb-info" data-disp="info" type="button">
          <span class="shape">&#9632;</span> Info
        </button>
        <button class="em-bulk-btn" id="em-bulk-category" type="button">Assign category&hellip;</button>
        <button class="em-bulk-btn bb-danger" id="em-bulk-delete" type="button">Move to Trash</button>
      </div>
      <!-- Email tab uses its own #content div; collides with timeline's
           #content but only one tab is active at a time so DOM queries
           don't cross. -->
    </div>

    <!-- ===== Lab Stats tab ===== -->
    <div class="act-tab tab-lab-stats">
      <div class="page-header">
        <h1 class="page-title">Lab Activity</h1>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="range-select" class="btn" style="font-size:14px;">
            <option value="7">Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </div>
      </div>
      <!-- Lab Stats tab uses its own #content. -->
    </div>

    <!-- Year-review's bulk-action floating bar (positioned fixed; only
         used by the timeline tab but harmless on others since CSS hides
         it when not opened). -->
    <div id="yr-actionbar" class="yr-actionbar act-tab tab-timeline">
      <span id="yr-sel-count">0 selected</span>
      <button class="primary" id="yr-sel-move">Move to new group…</button>
      <button class="primary" id="yr-sel-rate">Rate…</button>
      <button class="danger" id="yr-sel-discard">Discard</button>
      <button id="yr-sel-clear">Clear</button>
    </div>
  </div>

  <!-- Shared content container — only one tab uses it at a time. The
       timeline / email / lab-stats renderers all query `#content`; the
       overview / tracker render into their own named containers. To
       avoid renderer collisions we inject this single `#content` only
       when needed via the per-tab script init below. -->
  <script>
    (function () {
      var t = window.__ACT_TAB;
      if (t === 'timeline' || t === 'email' || t === 'lab-stats') {
        // Append the shared #content container to the active tab's block
        var tabBlock = document.querySelector('.act-tab.tab-' + t);
        if (tabBlock && !document.getElementById('content')) {
          var cdiv = document.createElement('div');
          cdiv.id = 'content';
          if (t === 'lab-stats') {
            cdiv.innerHTML = '<div class="empty-state">Connecting to website&hellip;</div>';
          } else {
            cdiv.textContent = 'Loading…';
          }
          tabBlock.appendChild(cdiv);
        }
      }
    })();
  </script>

  <!-- Shared scripts (used by every tab) -->
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/nav.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/activity-signals.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/live-sync-helper.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/local-cache.js"></script>
  <script src="/rm/js/sync-status.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <!-- V3.70 — Chart.js loaded eagerly via a regular <script> tag rather
       than the per-tab document.write loader below. Chrome was warning
       that document.write of cross-origin scripts MAY be blocked, and
       when blocked the email tab's renderTimeline() (which calls
       new Chart()) throws before renderEmails() ever runs — silently
       hiding the email list even though 250 rows were sitting in the
       cache. Loading Chart eagerly costs ~70 KB on tabs that don't use
       it (overview / lab-stats) but eliminates the timing bomb. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Per-tab renderer scripts via document.write so only the active
       tab's renderer boots, and its DOMContentLoaded listener fires at
       the natural time. -->
  <script>
    (function () {
      var t = window.__ACT_TAB;
      var SCRIPTS = {
        overview: [
          '/rm/js/yr-shared.js',
          '/rm/js/task-editor.js',
          '/rm/js/explorer-detail.js',
          '/rm/js/activity-overview.js'
        ],
        tracker: [
          // V3.320 — the rewritten tracker needs no category tree, no
          // Google GSI, no calendar service: one listEvents read + a
          // pure-DOM heatmap.
          '/rm/js/activity-tracker.js'
        ],
        timeline: [
          '/rm/js/yr-shared.js',
          // Chart.js hoisted to a regular <script> tag above (V3.70)
          '/rm/js/cv-schemas.js',
          '/rm/js/cv-send.js',
          '/rm/js/year-review.js'
        ],
        email: [
          '/rm/js/yr-shared.js',
          '/rm/js/disp-shared.js',
          '/rm/js/task-editor.js',
          // V3.289 — free client-side rules pre-filter (sender/subject/noise)
          // so scraped mail sorts into real categories instead of 'unknown'.
          '/rm/js/category-rules.js',
          // V3.292 — in-browser Naive Bayes classifier that learns live from
          // your hand-categorized mail; blended ahead of the rules.
          '/rm/js/email-classifier.js',
          // Chart.js hoisted to a regular <script> tag above (V3.70)
          '/rm/js/task-quick-builder.js',
          // V3.288 — oauth-connections powers the email tab's inline
          // "Connect Gmail" empty-state. The Google Identity SDK is NOT listed
          // here: it's lazy-loaded on demand by ensureGisLoaded() on first
          // connect, to avoid a parser-blocking cross-site document.write that
          // Chrome may block on poor networks.
          '/rm/js/oauth-connections.js',
          '/rm/js/email-review.js'
        ],
        'lab-stats': [
          '/rm/js/activity-summary.js'
        ]
      };
      (SCRIPTS[t] || []).forEach(function (s) {
        document.write('<scr' + 'ipt src="' + s + '"><\/scr' + 'ipt>');
      });
    })();
  </script>
</body>
</html>
