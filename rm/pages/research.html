<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/research.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script src="/rm/js/icons.js"></script>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Research</h1>
    </div>
    <div id="research-root"><p class="rf-loading">Loading the lab's research map…</p></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>

  <!-- RM auth + shell -->
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/chat-alert-watch.js" defer></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/local-cache.js"></script>
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/sync-status.js"></script>
  <script src="/rm/js/nav.js"></script>

  <!-- Reused: derived draft/grant status resolver for output cards -->
  <script src="/rm/js/library-associations.js"></script>
  <!-- V3.601 — attaching a paper to a roadmap item from THIS page must
       also write the meta.library.roadmaps reverse index, or the reader
       would never show the chip. ROADMAP_DATA calls LIBRARY_LINKS. -->
  <script src="/rm/js/library-links.js"></script>

  <!-- V3.544+ — Research Foci program -->
  <script src="/rm/js/focus-areas.js"></script>
  <script src="/rm/js/icon-picker.js"></script>
  <script src="/rm/js/research-data.js"></script>
  <script src="/rm/js/research-media.js"></script>
  <script src="/rm/js/research-links.js"></script>
  <script src="/rm/js/research-create.js"></script>
  <script src="/rm/js/research-composer.js"></script>
  <script src="/rm/js/research-progress.js"></script>
  <script src="/rm/js/research-publish.js"></script>
  <!-- V3.600 — roadmap: experiments → analyses → figures. roadmap-data.js
       is standalone (no RESEARCH_DATA dependency) so the library pages can
       load it without the rest of this stack. -->
  <script src="/rm/js/roadmap-data.js"></script>
  <script src="/rm/js/roadmap-attach.js"></script>
  <script src="/rm/js/research-roadmap.js"></script>
  <!-- V3.717 — a grant's page is a review of the work under it, not a card
       detail. Loads after roadmap-data.js (it reads analysis counts) and
       before research.js, which mounts it. -->
  <!-- V3.718 — a reference card reads its bibliography live from the lab
       library (api route library/papers.json), so it needs the adapter,
       which is already loaded above. -->
  <script src="/rm/js/research-references.js"></script>
  <script src="/rm/js/research-grant-review.js"></script>
  <script src="/rm/js/scientia-notes.js"></script>
  <script src="/rm/js/research.js"></script>
</body>
</html>
