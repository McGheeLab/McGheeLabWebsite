<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procurement — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/procurement.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script src="/rm/js/icons.js"></script>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Procurement</h1>
      <!-- V3.858 — same static zip as the Library page's install card. The
           extension's "+ Item" is how a vendor page becomes a request here. -->
      <a class="btn" style="text-decoration:none;" href="/rm/downloads/mcgheelab-capture-extension.zip" download="mcgheelab-capture-extension.zip"
         title="McGhee Lab Capture for Chrome: press + Item on a vendor page (Fisher, Sigma, VWR, Amazon…) to start a request here. Unzip, open chrome://extensions, turn on Developer mode, Load unpacked → the extension folder, then sign in with your lab-site Google account.">↓ Download extension (.zip)</a>
    </div>
    <p class="pt-muted" style="max-width: 760px; margin-bottom: 4px;">
      Ask for what you need; the approver hears about it, orders it, and whoever
      unpacks the box records where it went. Every step notifies the people it
      concerns and lands the item in inventory.
    </p>
    <div id="proc-root"><div class="empty-state">Loading…</div></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>

  <!-- RM auth + adapter + cache + nav -->
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/chat-alert-watch.js" defer></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/local-cache.js"></script>
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/live-sync-helper.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/sync-status.js"></script>
  <script src="/rm/js/nav.js"></script>

  <!-- Page: state machine (DOM-free, shared with the test suites) + renderer -->
  <script src="/rm/js/procurement-core.js"></script>
  <script src="/rm/js/procurement.js"></script>
</body>
</html>
