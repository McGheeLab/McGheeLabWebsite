<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    /* V3.60: paper-editor.html merged into paper-builder.html. Carry
     * over the ?id=<paper-id> query into the new ?paper=<paper-id>
     * form so old bookmarks survive. We can't use a simple
     * <meta refresh> because we need to preserve the id query param
     * across the URL change. */
    (function () {
      var qp = new URLSearchParams(location.search);
      var pid = qp.get('paper') || qp.get('id') || '';
      var dest = '/rm/pages/paper-builder.html' + (pid ? '?paper=' + encodeURIComponent(pid) : '');
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/rm/pages/paper-builder.html">Papers</a>…</p>
</body>
</html>
