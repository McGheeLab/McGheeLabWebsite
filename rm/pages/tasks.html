<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/activity-signals.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script>
    /* V3.58 — unified Tasks shell. Single page hosts four tabs
     * (dashboard / inbox / archive / add) selected via ?tab=<name>;
     * default is `dashboard`. Replaces the V3.40-era four-page setup
     * (tasks.html, tasks-inbox.html, tasks-archive.html,
     * tasks-add.html) which each shipped its own near-identical shell
     * and a manual cross-link tab bar. The other three pages now
     * `<meta refresh>` to `tasks.html?tab=<name>` so bookmarks
     * survive. */
    (function() {
      var validTabs = ['dashboard','inbox','archive','add'];
      var tab = new URLSearchParams(location.search).get('tab') || 'dashboard';
      if (validTabs.indexOf(tab) === -1) tab = 'dashboard';
      window.__TASKS_TAB = tab;
      var TITLES = {
        dashboard: 'Task Dashboard',
        inbox:     'Task List',
        archive:   'Completed Tasks',
        add:       'Add Task'
      };
      document.title = TITLES[tab] + ' — McGhee Lab';
    })();
  </script>
</head>
<body>
  <div class="page">
    <div class="tab-bar" id="task-hub-tabs"></div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const HUB = [
          { tab: 'dashboard', label: 'Dashboard' },
          { tab: 'add',       label: 'Add Task' },
          { tab: 'inbox',     label: 'Task List' },
          { tab: 'archive',   label: 'Completed' },
        ];
        const bar = document.getElementById('task-hub-tabs');
        const current = window.__TASKS_TAB;
        HUB.forEach(t => {
          const a = document.createElement('a');
          a.href = '/rm/pages/tasks.html?tab=' + t.tab;
          a.className = 'tab-btn' + (t.tab === current ? ' active' : '');
          a.textContent = t.label;
          a.style.textDecoration = 'none';
          if (t.tab === 'inbox') a.id = 'task-hub-tab-inbox';
          bar.appendChild(a);
        });
      });

      /* V3.160 — Inbox tab badge for unseen assigned tasks. Queries the
       * signed-in user's tasks/assigned and counts !assigned_seen_at && !done.
       * Refreshes on the rm:assigned-inbox-changed event fired by
       * tasks-dashboard-buckets.js when it stamps assigned_seen_at. */
      async function refreshInboxBadge() {
        try {
          const link = document.getElementById('task-hub-tab-inbox');
          if (!link) return;
          if (!window.firebridge || !firebridge.getUser) return;
          const me = firebridge.getUser();
          if (!me) return;
          const snap = await firebridge.db()
            .collection('userData').doc(me.uid)
            .collection('tasks')
            .where('bucket', '==', 'assigned')
            .get();
          let n = 0;
          snap.forEach(d => {
            const t = d.data();
            if (!t.done && !t.assigned_seen_at) n++;
          });
          let badge = link.querySelector('.tasks-tab-badge');
          if (n > 0) {
            if (!badge) {
              badge = document.createElement('span');
              badge.className = 'tasks-tab-badge';
              link.appendChild(badge);
            }
            badge.textContent = n;
          } else if (badge) {
            badge.remove();
          }
        } catch (err) {
          console.warn('[tasks.html] inbox badge refresh failed:', err);
        }
      }
      // Wait for firebridge to settle, then run.
      document.addEventListener('DOMContentLoaded', () => {
        const tryRefresh = () => {
          if (window.firebridge && firebridge.getUser && firebridge.getUser()) refreshInboxBadge();
          else setTimeout(tryRefresh, 500);
        };
        setTimeout(tryRefresh, 800);
      });
      window.addEventListener('rm:assigned-inbox-changed', refreshInboxBadge);
    </script>
    <div class="page-header" id="task-page-header"></div>
    <div id="task-tab-mount"></div>
  </div>

  <!-- Shared scripts (used by every tab) -->
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/nav.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/live-sync-helper.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/rm-dialog.js"></script>
  <script src="/rm/js/local-cache.js"></script>
  <script src="/rm/js/sync-status.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/forms.js"></script>
  <script src="/rm/js/yr-shared.js"></script>
  <script src="/rm/js/disp-shared.js"></script>
  <script src="/rm/js/card-grid.js"></script>
  <script src="/rm/js/links.js"></script>
  <script src="/rm/js/task-assign.js"></script>
  <!-- V3.317 — task marketplace composer (embedded mode: no #tm-board, no listener). -->
  <script src="/rm/js/task-market.js"></script>
  <!-- V3.194 — bridge to PMR (Add to PMR button + completion sync). -->
  <script src="/rm/js/task-pmr-sync.js"></script>
  <script src="/rm/js/activity-signals.js"></script>
  <!-- V3.234 — external links (Synology share URLs etc) on project buckets. -->
  <script src="/rm/js/external-links.js"></script>

  <!-- Render the per-tab header + container, then synchronously load
       the per-tab renderer via document.write so its DOMContentLoaded
       boot fires at the natural time. document.write is the simplest
       way to inject a parser-blocking <script> with a dynamic src. -->
  <script>
    (function() {
      var tab = window.__TASKS_TAB;
      var HEADERS = {
        dashboard: '<h1 class="page-title">Task Dashboard</h1>'
                 + '<div>'
                 + '  <button type="button" class="btn btn-primary" id="btn-add-task">+ Add Task</button>'
                 + '  <button type="button" class="btn" id="btn-assign-task" style="margin-left:6px;">Send to Teammate</button>'
                 + '</div>',
        inbox:    '<h1 class="page-title">Task List</h1>',
        archive:  '<h1 class="page-title">Completed Tasks</h1>',
        add:      '<h1 class="page-title">Add Task</h1>'
                 + '<div>'
                 + '  <a href="/rm/pages/tasks.html?tab=dashboard" class="btn" style="text-decoration:none">&larr; Dashboard</a>'
                 + '</div>'
      };
      var CONTAINERS = {
        dashboard: '<div id="dash-content">Loading…</div>',
        inbox:     '<div id="content">Loading…</div>',
        archive:   '<div id="content">Loading…</div>',
        add:       '<div id="dash-content">Loading…</div>'
      };
      var SCRIPTS = {
        dashboard: '/rm/js/tasks-dashboard-buckets.js',
        inbox:     '/rm/js/tasks-inbox-buckets.js',
        archive:   '/rm/js/tasks-archive-buckets.js',
        add:       '/rm/js/tasks-buckets.js'
      };
      document.getElementById('task-page-header').innerHTML = HEADERS[tab];
      document.getElementById('task-tab-mount').innerHTML = CONTAINERS[tab];
      document.write('<scr' + 'ipt src="' + SCRIPTS[tab] + '"><\/scr' + 'ipt>');
    })();
  </script>
  <script>
    if (window.__TASKS_TAB === 'dashboard') {
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btn-assign-task')?.addEventListener('click', () => {
          if (window.TASK_ASSIGN) TASK_ASSIGN.open();
        });
        // V3.144 — "+ Add Task" opens a modal that creates a subtask in a
        // chosen task builder. The dashboard module exposes the open fn
        // once it boots.
        document.getElementById('btn-add-task')?.addEventListener('click', () => {
          if (window.DASH_ADD_TASK) DASH_ADD_TASK.open();
          else alert('Dashboard still loading — try again in a moment.');
        });
      });
    }
  </script>
</body>
</html>
