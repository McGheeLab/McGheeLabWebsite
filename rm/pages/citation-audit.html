<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citation audit — RM</title>
  <script src="/rm/js/runtime-mode.js"></script>
  <link rel="stylesheet" href="/rm/css/style.css">
</head>
<body>
  <main id="ca-root" style="max-width:1100px;margin:0 auto;padding:18px;">
    <h2 style="margin:0 0 4px;">Citation-flow audit</h2>
    <p style="color:#6b7280;font-size:13px;margin:0 0 12px;">
      V3.310 dev harness — runs <code>PAPER_CITATIONS.analyzeDocument</code>
      (reference-driven inline localization) across every stored paper with a
      PDF + stored references. Read-only; tune the detector against real
      styles, not one paper at a time.
    </p>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <button class="btn" id="ca-run">▶ Run audit</button>
      <span id="ca-status" style="font-size:12px;color:#6b7280;"></span>
    </div>
    <div id="ca-totals" style="font-size:13px;margin-bottom:8px;"></div>
    <div id="ca-table" style="border:1px solid #e5e7eb;border-radius:8px;overflow:auto;"></div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/library-extras.js"></script>
  <script src="/rm/js/library-upload.js"></script>
  <script src="/rm/js/paper-citations.js"></script>
  <script type="module" src="/rm/js/pdf-viewer.js"></script>
  <script src="/rm/js/citation-audit.js"></script>
</body>
</html>
