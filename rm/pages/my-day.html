<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Week — McGhee Lab</title>
  <style>html,body{background:#f5f6fa;margin:0;height:100%}</style>
  <!-- V3.638 — My Day was renamed to My Week; the page now lives at
       my-week.html. This stub cannot be deleted: /rm/pages/my-day.html is
       baked into data that is already written and is NOT migrated —
       day-distribute.js stamped it as the `reference_links` url on every
       notebook stub it has ever created, past notification/feed docs carry
       it, lab members have it bookmarked, and installed iOS builds use it
       as the My Week tab's start path until the matching app build lands.

       The script runs first and PRESERVES ?search + #hash — ?date= and
       ?view= must survive the hop, and a bare meta refresh drops them.
       The <noscript> meta refresh is the no-JS fallback only. -->
  <script>location.replace('/rm/pages/my-week.html' + location.search + location.hash);</script>
  <noscript><meta http-equiv="refresh" content="0;url=/rm/pages/my-week.html"></noscript>
  <script src="/rm/js/build-check.js" async></script>  <!-- V3.916: an open page follows each deploy -->
</head>
<body>
  <p style="font:14px system-ui;padding:24px;color:#6b7280">
    My Day is now <a href="/rm/pages/my-week.html">My Week</a>…
  </p>
</body>
</html>
