<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whiteboard — Lab Notebook</title>
  <!-- V3.830 — the whiteboard block of a lab-notebook entry. Hosted in an
       iframe by /rm/pages/notebook.html (one board per document: the engine
       is a singleton). Same origin ⇒ the Firebase session is already shared;
       /firebase-config.js provides McgheeLab.db and the auth shim below
       provides McgheeLab.Auth, exactly like modules/shared/whiteboard-panel.js. -->
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/whiteboard-board.css">
  <link rel="stylesheet" href="/rm/vendor/pdfjs/pdf_viewer.css">
  <link rel="stylesheet" href="/rm/css/notebook-board.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script src="/rm/js/icons.js"></script>
</head>
<body class="nbb-body">
  <div id="nbb-root" class="nbb-root">
    <div class="nbb-bar" id="nbb-bar"></div>
    <div class="nbb-main" id="nbb-main">
      <div class="nbb-mount" id="nbb-mount"><div class="nbb-loading">Loading the board…</div></div>
      <aside class="nbb-picker" id="nbb-picker" hidden></aside>
    </div>
    <div class="nbb-recs" id="nbb-recs" hidden></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="/firebase-config.js"></script>
  <script src="/rm/js/page-layout.js"></script>
  <script type="module" src="/rm/js/pdf-viewer.js"></script>
  <script src="/whiteboard.js"></script>
  <script src="/whiteboard-replay.js"></script>
  <script src="/rm/js/notebook-board.js"></script>
</body>
</html>
