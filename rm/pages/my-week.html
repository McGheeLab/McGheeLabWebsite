<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Week — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/css/my-week.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script src="/rm/js/icons.js"></script>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1 class="page-title">My Week</h1>
    </div>
    <div id="myday-root"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <!-- V3.623 — outcome images upload via PAPER_FIGURES (Storage SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>

  <!-- RM auth + adapter + cache + nav -->
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/chat-alert-watch.js" defer></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/local-cache.js"></script>
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/sync-status.js"></script>
  <script src="/rm/js/nav.js"></script>

  <!-- My Week distribution stack (V3.526 program):
       activity-signals  → tracker adapter emit seam
       task-pmr-sync     → pmr_week adapter week-picker reuse
       notebook-schemas  → notebook-stub constructors (plain script, no deps)
       equipment-availability → inline availability strip + booking checks
       day-distribute    → the fan-out engine (window.DAY_DISTRIBUTE) -->
  <script src="/rm/js/activity-signals.js"></script>
  <script src="/rm/js/task-pmr-sync.js"></script>
  <script src="/rm/js/notebook-schemas.js"></script>
  <script src="/rm/js/equipment-availability.js"></script>
  <script src="/rm/js/day-distribute.js"></script>
  <!-- V3.537 — mentor↔mentee weekly-focus data layer (focus panel + 🎯 pill) -->
  <!-- V3.602 — a weekly focus can align to a specific roadmap ANALYSIS;
       focus-areas.js reads roadmaps through ROADMAP_DATA and mirrors the
       pick into roadmapClaims, so this must load first. -->
  <script src="/rm/js/roadmap-data.js"></script>
  <!-- V3.717 — RESEARCH_DATA owns the card chain (specialty → concept →
       grant → aim → output). focus-areas.js walks it to resolve which
       grant a pickable card belongs to; without this it falls back to the
       direct grant link and misses outputs that reach a grant via an aim. -->
  <script src="/rm/js/research-data.js"></script>
  <script src="/rm/js/focus-areas.js"></script>
  <script src="/rm/js/semesters.js"></script>
  <!-- V3.623 — outcome-image upload helper (paper-figures/myday-<itemId>
       pseudo-id, the PMR-barriers precedent; lab-readable, SHA-256 dedup) -->
  <script src="/rm/js/paper-figures.js"></script>
  <script src="/rm/js/page-time-tracker.js"></script>
  <script src="/rm/js/my-week.js"></script>
</body>
</html>
