<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory labels — print sheet</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <script src="/rm/js/icons.js"></script>
  <style>
    /* V3.834 — a browser print page for inventory QR labels: any printer, any
       label stock. The Zebra on the lab PC takes the labelQueue route instead
       (inventory-labels.js queue()); this page is the sheet-of-stickers path. */
    body { background: #f3f4f6; }
    .il-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 5; }
    .il-bar select, .il-bar input { font-size: 14px; padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 8px; }
    .il-status { font-size: 12px; color: #6b7280; }
    .il-sheet { margin: 16px auto; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .il-label { box-sizing: border-box; display: flex; align-items: center; gap: 6px; overflow: hidden; border: 1px dashed #e5e7eb; padding: 4px; page-break-inside: avoid; break-inside: avoid; }
    .il-label svg { flex-shrink: 0; display: block; }
    .il-text { min-width: 0; line-height: 1.15; }
    .il-name { font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .il-sub, .il-loc { color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .il-code { font-family: ui-monospace, Menlo, monospace; letter-spacing: .04em; }
    .il-empty { padding: 40px; text-align: center; color: #6b7280; }
    @media print {
      body { background: #fff; }
      .il-bar { display: none; }
      .il-sheet { margin: 0; box-shadow: none; }
      .il-label { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div class="il-bar">
    <strong>Inventory labels</strong>
    <label>Label stock
      <select id="il-stock">
        <option value="avery5160">Avery 5160 — 2⅝ × 1 in, 30 per Letter sheet</option>
        <option value="dymo30252">DYMO 30252 — 3½ × 1⅛ in address label</option>
        <option value="sq2">2 × 2 in square (Avery 22806 / generic)</option>
        <option value="strip">Zebra strip — 1.69 × 0.37 in (one cell)</option>
        <option value="custom">Custom…</option>
      </select>
    </label>
    <span id="il-custom" style="display:none;">
      <label>W <input id="il-w" type="number" step="0.01" min="0.5" value="2" style="width:70px;"> in</label>
      <label>H <input id="il-h" type="number" step="0.01" min="0.3" value="1" style="width:70px;"> in</label>
      <label>Cols <input id="il-cols" type="number" min="1" value="3" style="width:56px;"></label>
    </span>
    <label><input type="checkbox" id="il-loc-on" checked> location</label>
    <label><input type="checkbox" id="il-vendor-on" checked> vendor · cat #</label>
    <button class="btn btn-primary" id="il-print"><i data-hi="printer"></i> Print</button>
    <span class="il-status" id="il-status">Loading…</span>
  </div>
  <div id="il-sheet" class="il-sheet"></div>

  <script src="/rm/js/util.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/label-id.js"></script>
  <script src="/rm/js/scan-resolve.js"></script>
  <script src="/rm/vendor/qrcode/qrcode.js"></script>
  <script src="/rm/js/inventory-labels.js"></script>
  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var C = window.INV_LABELS_CORE;
    // Each preset: label size in inches, columns across, page size, margins. Row
    // pitch equals the label height so a 30-up sheet lines up with its die cut.
    var STOCK = {
      avery5160: { w: 2.625, h: 1.0, cols: 3, page: 'letter', pm: '0.5in 0.1875in', gapX: 0.125 },
      dymo30252: { w: 3.5, h: 1.125, cols: 1, page: '3.5in 1.125in', pm: '0', gapX: 0 },
      sq2:       { w: 2.0, h: 2.0, cols: 3, page: 'letter', pm: '0.5in 0.75in', gapX: 0.25 },
      strip:     { w: 1.69, h: 0.37, cols: 1, page: '1.69in 0.37in', pm: '0', gapX: 0 },
    };
    var _items = [];

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function stock() {
      var k = $('il-stock').value;
      if (k !== 'custom') return STOCK[k];
      return { w: parseFloat($('il-w').value) || 2, h: parseFloat($('il-h').value) || 1, cols: Math.max(1, parseInt($('il-cols').value, 10) || 1), page: 'letter', pm: '0.5in', gapX: 0.1 };
    }
    function pageStyle(s) {
      var el = $('il-page-style') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'il-page-style' }));
      el.textContent = '@page { size: ' + s.page + '; margin: ' + s.pm + '; }';
    }
    function qrFor(code, px) {
      var enc = QRCODE.encode(C.payloadFor(code), { ecc: 'M' });
      return QRCODE.toSvg(enc.modules, { scale: 4, margin: 1, width: px });
    }
    function render() {
      var s = stock(); pageStyle(s);
      var host = $('il-sheet');
      var showLoc = $('il-loc-on').checked, showVendor = $('il-vendor-on').checked;
      var qrIn = Math.min(s.h - 0.12, s.w * 0.45);                    // the QR is a square of the label height
      var fontPt = Math.max(5, Math.min(9, s.h * 7.5));
      host.style.width = (s.cols * s.w + (s.cols - 1) * s.gapX) + 'in';
      host.style.display = 'grid';
      host.style.gridTemplateColumns = 'repeat(' + s.cols + ', ' + s.w + 'in)';
      host.style.columnGap = s.gapX + 'in';
      host.style.rowGap = '0';
      if (!_items.length) { host.innerHTML = '<div class="il-empty">No items to print. Open this page from the inventory (' + ICON.svg('tag') + ' Print labels) so it carries the item ids.</div>'; return; }
      host.innerHTML = _items.map(function (it) {
        var code = C.codeOf(it);
        var sub = [it.vendor, it.catalogue_number].filter(Boolean).join(' · ');
        var loc = Array.isArray(it.locations) ? it.locations.map(function (l) { return l && (l.name || l.locId); }).filter(Boolean).join(', ') : '';
        return '<div class="il-label" style="width:' + s.w + 'in;height:' + s.h + 'in;font-size:' + fontPt + 'pt;">' +
          (code ? qrFor(code, qrIn * 96) : '<div style="width:' + qrIn + 'in;height:' + qrIn + 'in;border:1px dashed #ccc;font-size:7pt;color:#999;display:flex;align-items:center;justify-content:center;">no code</div>') +
          '<div class="il-text"><div class="il-name">' + esc(it.name || 'Item') + '</div>' +
          (showVendor && sub ? '<div class="il-sub">' + esc(sub) + '</div>' : '') +
          (showLoc && loc ? '<div class="il-loc">' + esc(loc) + '</div>' : '') +
          (code ? '<div class="il-code">' + esc(code) + '</div>' : '') +
          '</div></div>';
      }).join('');
      $('il-status').textContent = _items.length + ' label' + (_items.length === 1 ? '' : 's') + ' · ' + (s.w + ' × ' + s.h + ' in');
    }

    async function load() {
      var p = new URLSearchParams(location.search);
      if (p.get('fixture') === '1') {   // selftest + a look without an account
        _items = [
          { id: 'fx-1', name: 'Anti-β-tubulin antibody, mouse monoclonal', vendor: 'Sigma-Aldrich', catalogue_number: 'T4026', label_code: 'MG-A7K2X', locations: [{ name: '-20 °C freezer, box 4' }] },
          { id: 'fx-2', name: 'Conical tubes 50 mL, sterile', vendor: 'VWR', catalogue_number: '76520-944', label_code: 'MG-9Y3RK', locations: [{ name: 'Shelf A2' }] },
          { id: 'fx-3', name: 'Matrigel Matrix, LDEV-free', vendor: 'Corning', catalogue_number: '354234', label_code: '' },
        ];
        render(); return;
      }
      var ids = (p.get('ids') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      if (!ids.length) { _items = []; render(); return; }
      var db = firebridge.db();
      var docs = await Promise.all(ids.map(function (id) { return db.collection('inventory').doc(id).get(); }));
      _items = docs.filter(function (d) { return d.exists; }).map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      // An item that has no code yet gets one here — the label must be scannable.
      var missing = _items.filter(function (it) { return !C.codeOf(it); });
      if (missing.length && window.INV_LABELS) {
        $('il-status').textContent = 'Minting ' + missing.length + ' code' + (missing.length === 1 ? '' : 's') + '…';
        for (var i = 0; i < missing.length; i++) { try { await INV_LABELS.ensureCode(missing[i]); } catch (e) { console.warn('[labels] mint failed', e); } }
      }
      render();
    }

    ['il-stock', 'il-w', 'il-h', 'il-cols', 'il-loc-on', 'il-vendor-on'].forEach(function (id) { $(id).addEventListener('change', function () { $('il-custom').style.display = $('il-stock').value === 'custom' ? '' : 'none'; render(); }); });
    $('il-print').addEventListener('click', function () { window.print(); });
    if (new URLSearchParams(location.search).get('fixture') === '1') load();
    else if (typeof firebridge !== 'undefined' && firebridge.onAuth) firebridge.onAuth(function (u) { if (u) load().catch(function (e) { $('il-status').textContent = e.message || 'Could not load.'; }); else $('il-status').textContent = 'Sign in to load the items.'; });
    else load();
  })();
  </script>
</body>
</html>
