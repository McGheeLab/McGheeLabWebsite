<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Market — McGhee Lab</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <script src="/rm/js/runtime-mode.js"></script>
  <style>
    .tm-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .tm-toolbar .hint{font-size:12px;color:#6b7280}
    .tm-toolbar .grow{flex:1 1 auto}
    .tm-toolbar button{font-size:13px;padding:7px 14px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer}
    .tm-toolbar button.primary{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}

    #tm-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
    @media(max-width:1100px){#tm-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:640px){#tm-board{grid-template-columns:1fr}}
    .tm-col{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:10px;min-height:120px}
    .tm-col-head{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#475569;margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .tm-count{font-size:11px;background:#e2e8f0;color:#475569;border-radius:10px;padding:1px 7px;font-weight:600}
    .tm-col-body{display:flex;flex-direction:column;gap:8px}

    .tm-card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .tm-card-head{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
    .tm-chip{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:8px}
    .tm-chip.offer{background:#dbeafe;color:#1e3a8a}
    .tm-chip.request{background:#fef3c7;color:#92400e}
    .tm-chip.handoff{background:#ede9fe;color:#5b21b6}
    .tm-chip.st-claimed,.tm-chip.st-accepted{background:#dcfce7;color:#166534}
    .tm-chip.st-completed{background:#f3f4f6;color:#374151}
    .tm-chip.st-withdrawn,.tm-chip.st-declined{background:#fee2e2;color:#991b1b}
    .tm-due{font-size:11px;color:#b45309;margin-left:auto;font-variant-numeric:tabular-nums}
    .tm-title{font-weight:600;color:#1f2937;line-height:1.35}
    .tm-desc{font-size:12px;color:#4b5563;margin-top:4px;white-space:pre-wrap;max-height:72px;overflow:hidden}
    .tm-meta{font-size:11px;color:#6b7280;margin-top:6px}
    .tm-claimed{font-size:11px;color:#166534;margin-top:4px}
    .tm-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .tm-btn{font-size:12px;padding:4px 10px;border:1px solid #d1d5db;border-radius:5px;background:#fff;cursor:pointer;color:#374151}
    .tm-btn.primary{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600}
    .tm-btn.danger{color:#991b1b;border-color:#fecaca;background:#fef2f2}
    .tm-empty{padding:16px 10px;text-align:center;color:#9ca3af;font-size:12px;border:1px dashed #e5e7eb;border-radius:8px;background:#fff}
    .tm-error{padding:14px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;font-size:13px;grid-column:1/-1}
    .tm-resolved{margin-top:6px}
    .tm-resolved summary{font-size:11px;color:#6b7280;cursor:pointer;padding:4px 2px}
    .tm-resolved .tm-card{opacity:.7;margin-top:6px}

    .tm-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid #e5e7eb}
    .tm-tabs button{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:500;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent}
    .tm-tabs button.active{color:#1e3a8a;border-bottom-color:#2563eb}

    .tm-atoolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .tm-atoolbar select{font-size:13px;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
    .tm-alist{display:flex;flex-direction:column;gap:6px}
    .tm-arow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
    .tm-arow .who{font-size:11px;color:#6b7280}
    .tm-arow .who strong{color:#1f2937}
    .tm-arow .title{min-width:0}
    .tm-arow .title a{color:#1f2937;text-decoration:none;font-weight:500;border-bottom:1px dotted #9ca3af}
    .tm-arow .title a:hover{border-bottom-style:solid}
    .tm-arow .due{font-size:12px;color:#6b7280;font-variant-numeric:tabular-nums;white-space:nowrap}

    .tm-overlay{position:fixed;inset:0;z-index:9000;background:rgba(11,13,18,.55);display:flex;align-items:center;justify-content:center;padding:24px}
    .tm-modal{background:#fff;color:#111;border-radius:12px;max-width:520px;width:100%;padding:22px;box-shadow:0 24px 48px rgba(0,0,0,.4);max-height:90vh;overflow:auto}
    .tm-modal h2{margin:0 0 14px;font-size:17px}
    .tm-form{display:grid;gap:12px}
    .tm-form label{display:grid;gap:4px;font-size:12px;color:#374151}
    .tm-form input,.tm-form select,.tm-form textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit}
    .tmf-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .tmf-status{font-size:13px;color:#991b1b;min-height:16px}
    .tmf-actions{display:flex;gap:8px;justify-content:flex-end}
    .tmf-actions .tm-btn{font-size:13px;padding:7px 14px}
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Task Market</h1>
      <div class="tm-toolbar">
        <span class="hint">Offer tasks to the lab, ask for work, or hand a task to a teammate — everything cross-user lives here.</span>
        <span class="grow"></span>
        <button id="tm-need-work">🙋 I need work</button>
        <button id="tm-new" class="primary">＋ New post</button>
      </div>
      <div class="tm-tabs" id="tm-tabs">
        <button data-view="board" class="active">Board</button>
        <button data-view="assignments">Assignments</button>
      </div>
    </div>
    <div id="tm-board"><div class="tm-empty" style="grid-column:1/-1">Loading…</div></div>
    <div id="tm-assignments" hidden></div>
  </div>
  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/nav.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/task-assign.js"></script>
  <script src="/rm/js/task-market.js"></script>
</body>
</html>
