<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- V3.480 — the Task Market board folded into the unified Tasks page as
       the `market` tab (same consolidation pattern as the V3.58
       tasks-inbox/archive/add pages). This redirect preserves bookmarks
       and carries the ?view=assignments deep-link through to the tab. -->
  <script>
    (function () {
      var view = new URLSearchParams(location.search).get('view');
      var url = '/rm/pages/tasks.html?tab=market' +
        (view === 'assignments' ? '&view=assignments' : '');
      location.replace(url);
    })();
  </script>
  <!-- No-JS fallback (defaults to the board view). -->
  <meta http-equiv="refresh" content="0; url=/rm/pages/tasks.html?tab=market">
  <title>Task Market — moved to Tasks</title>
  <script src="/rm/js/build-check.js" async></script>  <!-- V3.916: an open page follows each deploy -->
</head>
<body>
  <p style="font-family:system-ui,sans-serif;padding:24px">
    The Task Market now lives on the
    <a href="/rm/pages/tasks.html?tab=market">Tasks page</a>.
  </p>
</body>
</html>
