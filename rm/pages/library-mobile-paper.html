<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper — Ourlab Library</title>
  <link rel="stylesheet" href="/rm/css/tokens.css">
  <link rel="stylesheet" href="/rm/css/style.css">
  <link rel="stylesheet" href="/rm/vendor/pdfjs/pdf_viewer.css">
  <link rel="stylesheet" href="/rm/css/library-mobile.css">
  <script src="/rm/js/runtime-mode.js"></script>
</head>
<body class="lib-m lmp-body">
  <div class="lmp-page">
    <!-- Slim top bar: back · title · 🖍 highlight mode · 📝 notes -->
    <div class="lmp-bar">
      <button class="lmp-bar-btn" id="lmp-back" type="button" aria-label="Back to library">←</button>
      <div class="lmp-title" id="lmp-title">Loading…</div>
      <button class="lmp-bar-btn" id="lmp-hl" type="button" aria-label="Highlight mode" aria-pressed="false" hidden>🖍</button>
      <button class="lmp-bar-btn" id="lmp-notes" type="button" aria-label="Notes and info">📝</button>
    </div>

    <!-- The viewer keeps id="lp-viewer": annotation-overlay's focus()
         scroll math resolves the container by that id. -->
    <div class="lmp-viewer" id="lp-viewer"></div>

    <!-- Transient page indicator ("3 / 12"), fades after page changes. -->
    <div class="lmp-pill" id="lmp-pill" hidden></div>

    <div class="lmp-status" id="lmp-status"></div>

    <!-- Notes panel: full-height slide-up (own CSS, no 640px media-query
         coupling — works on iPad too). Hosts paper info + the SAME
         annotation panel module the desktop reader uses. -->
    <div class="lmp-panel-back" id="lmp-panel-back" hidden></div>
    <div class="lmp-panel" id="lmp-panel" aria-hidden="true">
      <div class="lmp-panel-grip"></div>
      <div class="lmp-panel-head">
        <span class="lmp-panel-title">Notes</span>
        <button class="lmp-panel-close" id="lmp-panel-close" type="button" aria-label="Close notes">▾</button>
      </div>
      <details class="lmp-info" id="lmp-info-details">
        <summary>ℹ️ Paper info</summary>
        <div id="lmp-info"></div>
      </details>
      <div class="lp-annotations lmp-panel-body" id="lp-annotations">
        <div class="lp-annotations-inner" id="lp-annotations-inner">
          <div class="lp-annotations-empty">Annotations load when you sign in…</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/rm/js/util.js"></script>
  <script src="/rm/js/nav.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-storage-compat.js"></script>
  <script src="/rm/js/firebase-bridge.js"></script>
  <script src="/rm/js/api-firestore-adapter.js"></script>
  <script src="/rm/js/api-routes.js"></script>
  <script src="/rm/js/toast.js"></script>
  <script src="/rm/js/local-cache.js"></script>
  <script src="/rm/js/sync-status.js"></script>
  <script src="/rm/js/profile-bootstrap.js"></script>
  <script src="/rm/js/library-upload.js"></script>
  <!-- V3.371 shared page-layout segmentation engine; must load before
       pdf-viewer (same ordering contract as library-paper.html). -->
  <script src="/rm/js/page-layout.js"></script>
  <script type="module" src="/rm/js/pdf-viewer.js"></script>
  <script src="/rm/js/annotation-anchor.js"></script>
  <script src="/rm/js/annotation-overlay.js"></script>
  <script src="/rm/js/geom-selection.js"></script>
  <script src="/rm/js/annotation-sync.js"></script>
  <script src="/rm/js/annotation-groups.js"></script>
  <script src="/rm/js/annotation-panel.js"></script>
  <script src="/rm/js/claims.js"></script>
  <!-- V3.352 atomic linked_drafts writer (evidence auto-link). -->
  <script src="/rm/js/library-links.js"></script>
  <script src="/rm/js/app-sheet.js"></script>
  <script src="/rm/js/viewer-touch.js"></script>
  <script src="/rm/js/library-mobile-paper.js"></script>
</body>
</html>
