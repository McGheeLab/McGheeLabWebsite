<!doctype html><html><head><meta charset="utf-8"><title>Standard-curve plate and wash timing</title>
<style>html,body{margin:0;background:#fff}svg{display:block;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}</style></head><body>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="2400" height="1340">
  <rect width="1200" height="670" fill="#fff"/>
  <text x="40" y="52" font-size="27" font-weight="700" fill="#1b1b1a">The standard-curve plate and its timing (Exp 12)</text>
  <text x="40" y="84" font-size="16.5" fill="#52514e">Eleven half-log standards from 1 pM to 100 nM plus a blank, at three detection-antibody levels, in duplicate.</text>
  <text x="40" y="106" font-size="16.5" fill="#52514e">Washing one column at a time keeps the delay from wash to image the same for every well.</text>
  <g id="plate" transform="translate(40,140)"></g>
  <g id="gantt" transform="translate(700,140)"></g>
</svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, a, parent, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (text != null) e.textContent = text; parent.appendChild(e); return e; };
// ---- plate: columns 1..12 = blank, 1 pM ... 100 nM (half-log); rows A-F = D_T 1, 2, 5 x K2 in duplicate; G-H spare / reference
const P = document.getElementById('plate'), cell = 38, x0 = 34, y0 = 44;
const blues = ['#f3f6fb', '#e3edfa', '#cde2fb', '#b7d3f6', '#9ec5f4', '#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab'];
const conc = ['0', '1p', '3p', '10p', '32p', '0.1n', '0.3n', '1n', '3n', '10n', '32n', '100n'];
el('text', { x: 0, y: 0, 'font-size': 15, 'font-weight': 700, fill: '#1b1b1a' }, P, '96-well plate map');
for (let c = 0; c < 12; c++) { el('text', { x: x0 + c * cell + cell / 2, y: y0 - 22, 'font-size': 12, 'text-anchor': 'middle', fill: '#52514e' }, P, String(c + 1)); el('text', { x: x0 + c * cell + cell / 2, y: y0 - 6, 'font-size': 10.5, 'text-anchor': 'middle', fill: '#7d7c77' }, P, conc[c]); }
const rowLab = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'], rowD = ['1 × K₂', '', '2 × K₂', '', '5 × K₂', '', 'reference', ''];
for (let r = 0; r < 8; r++) {
  el('text', { x: x0 - 12, y: y0 + r * cell + cell / 2 + 4, 'font-size': 12, 'text-anchor': 'end', fill: '#52514e' }, P, rowLab[r]);
  for (let c = 0; c < 12; c++) {
    const cx = x0 + c * cell + cell / 2, cy = y0 + r * cell + cell / 2;
    if (r < 6) el('circle', { cx, cy, r: 15, fill: blues[c], stroke: '#9fb3c8', 'stroke-width': 1 }, P);
    else el('circle', { cx, cy, r: 15, fill: '#fff', stroke: '#c9c6bf', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, P);
  }
}
for (const [r, l1, l2] of [[0, 'detection Ab', '1 × K₂'], [2, 'detection Ab', '2 × K₂'], [4, 'detection Ab', '5 × K₂'], [6, 'spare: buffer,', 'NSB, reference']]) {
  el('rect', { x: x0 - 4, y: y0 + r * cell + 2, width: 12 * cell + 8, height: 2 * cell - 4, rx: 10, fill: 'none', stroke: r < 6 ? '#6250d6' : '#c9c6bf', 'stroke-width': 1.5 }, P);
  el('text', { x: x0 + 12 * cell + 14, y: y0 + r * cell + cell - 4, 'font-size': 12.5, fill: r < 6 ? '#4a3aa7' : '#7d7c77' }, P, l1);
  el('text', { x: x0 + 12 * cell + 14, y: y0 + r * cell + cell + 12, 'font-size': 12.5, fill: r < 6 ? '#4a3aa7' : '#7d7c77', 'font-weight': r < 6 ? 600 : 400 }, P, l2);
}
el('text', { x: x0, y: y0 + 8 * cell + 26, 'font-size': 12.5, fill: '#52514e' }, P, 'Column header: analyte (p = pM, n = nM). Unknowns are run at 1× and 10× dilution: the two must agree,');
el('text', { x: x0, y: y0 + 8 * cell + 44, 'font-size': 12.5, fill: '#52514e' }, P, 'or the sample is past the hook. Each well: ≥ 100 beads in one 20x field.');
// ---- gantt: column-staggered wash. Per column: wash 0.4 min, spin 1 min, hold to 5 min, image 8 wells in ~1.8 min.
const G = document.getElementById('gantt'), gx = 40, gy = 44, W = 440, T = 30, sx = t => gx + t / T * W, rowH = 24, img = 1.8, delay = 5;
el('text', { x: 0, y: 0, 'font-size': 15, 'font-weight': 700, fill: '#1b1b1a' }, G, 'Column-staggered wash (Λ ≥ 2×10⁻⁴ s⁻¹)');
for (let t = 0; t <= T; t += 5) { el('line', { x1: sx(t), y1: gy - 8, x2: sx(t), y2: gy + 12 * rowH + 4, stroke: '#ebe9e4' }, G); el('text', { x: sx(t), y: gy + 12 * rowH + 22, 'font-size': 11.5, 'text-anchor': 'middle', fill: '#7d7c77' }, G, t + ' min'); }
for (let c = 0; c < 12; c++) {
  const y = gy + c * rowH, tw = c * img;   // wash each column one imaging-slot after the previous one
  el('text', { x: gx - 8, y: y + 15, 'font-size': 11.5, 'text-anchor': 'end', fill: '#52514e' }, G, 'col ' + (c + 1));
  el('rect', { x: sx(tw), y: y + 4, width: Math.max(2, sx(tw + 0.4) - sx(tw)), height: 14, fill: '#6250d6' }, G);
  el('rect', { x: sx(tw + 0.5), y: y + 4, width: sx(tw + 1.5) - sx(tw + 0.5), height: 14, fill: '#b7aef0' }, G);
  el('rect', { x: sx(tw + 1.5), y: y + 10, width: sx(tw + delay) - sx(tw + 1.5), height: 2, fill: '#c9c6bf' }, G);
  el('rect', { x: sx(tw + delay), y: y + 4, width: sx(tw + delay + img) - sx(tw + delay), height: 14, rx: 2, fill: '#eda100' }, G);
}
const ly = gy + 12 * rowH + 44;
[['#6250d6', 'wash'], ['#b7aef0', 'spin 1 min'], ['#c9c6bf', 'hold to 5 min'], ['#eda100', 'image 8 wells']].forEach(([c, l], i) => { const x = gx + [0, 70, 180, 300][i]; el('rect', { x, y: ly - 10, width: 14, height: 12, fill: c }, G); el('text', { x: x + 20, y: ly, 'font-size': 12, fill: '#52514e' }, G, l); });
el('text', { x: gx, y: ly + 28, 'font-size': 12.5, fill: '#52514e' }, G, 'Every well is imaged 5–6.8 min after its own wash. At Λ = 8.6×10⁻⁴ s⁻¹ the');
el('text', { x: gx, y: ly + 46, 'font-size': 12.5, fill: '#52514e' }, G, 'spread within a column is ±4–5 %; one wash for the whole plate would');
el('text', { x: gx, y: ly + 64, 'font-size': 12.5, fill: '#52514e' }, G, 'spread the loss over 63–71 %. Measure Λ first (Exp 11).');
</script></body></html>
