<!doctype html><html><head><meta charset="utf-8"><title>AX R set-up</title>
<style>html,body{margin:0;background:#fff}svg{display:block;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}</style></head><body>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="2400" height="1440">
  <defs>
    <marker id="ex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7fb800"/></marker>
    <marker id="em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/></marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7d7c77"/></marker>
    <style>.b{fill:#fcfcfb;stroke:#b9b6ae;stroke-width:1.5}.t{font-size:15px;font-weight:700;fill:#1b1b1a}.s{font-size:12.5px;fill:#52514e}.k{font-size:13px;fill:#52514e}.kb{font-size:13px;fill:#1b1b1a;font-weight:600}</style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="40" y="52" font-size="27" font-weight="700" fill="#1b1b1a">The AX R set-up for PE beads</text>
  <text x="40" y="84" font-size="16.5" fill="#52514e">Excitation (green) and the PE emission path (orange), with where each recommended setting acts.</text>
  <text x="40" y="106" font-size="16.5" fill="#52514e">Beads are found and focused on in transmitted light, so the PE is exposed once, for the measurement.</text>

  <!-- excitation path -->
  <rect class="b" x="40" y="160" width="170" height="78" rx="10"/><text class="t" x="56" y="186">561 nm laser</text>
  <text class="s" x="56" y="207">set in µW measured at</text><text class="s" x="56" y="224">the sample, never in %</text>
  <line x1="210" y1="190" x2="300" y2="190" stroke="#7fb800" stroke-width="4" marker-end="url(#ex)"/>
  <line x1="300" y1="165" x2="340" y2="215" stroke="#52514e" stroke-width="5"/>
  <text class="s" x="320" y="152" text-anchor="middle">main dichroic</text>
  <line x1="322" y1="190" x2="420" y2="190" stroke="#7fb800" stroke-width="4" marker-end="url(#ex)"/>
  <rect class="b" x="420" y="160" width="170" height="78" rx="10"/><text class="t" x="436" y="186">Galvano scanner</text>
  <text class="s" x="436" y="207">2 µs dwell, 2048² at</text><text class="s" x="436" y="224">zoom 1 = 0.43 µm pixels</text>
  <line x1="590" y1="190" x2="660" y2="190" stroke="#7fb800" stroke-width="4" marker-end="url(#ex)"/>
  <rect class="b" x="660" y="160" width="170" height="78" rx="10"/><text class="t" x="676" y="186">Objective</text>
  <text class="s" x="676" y="207">20x/0.80 (or 0.75) at 1 AU;</text><text class="s" x="676" y="224">10x/0.45 for throughput</text>
  <line x1="830" y1="190" x2="890" y2="190" stroke="#7fb800" stroke-width="4" marker-end="url(#ex)"/>
  <!-- sample -->
  <rect class="b" x="890" y="140" width="200" height="118" rx="10"/><text class="t" x="906" y="166">Sample</text>
  <text class="s" x="906" y="186">glass-bottom 96-well (#1.5H)</text>
  <line x1="908" y1="238" x2="1072" y2="238" stroke="#9fbccb" stroke-width="5"/>
  <g fill="#f0a400"><circle cx="930" cy="226" r="9"/><circle cx="968" cy="226" r="9"/><circle cx="1012" cy="226" r="9"/><circle cx="1050" cy="226" r="9"/></g>
  <g fill="#e2ddd3"><circle cx="930" cy="226" r="6"/><circle cx="968" cy="226" r="6"/><circle cx="1012" cy="226" r="6"/><circle cx="1050" cy="226" r="6"/></g>
  <text class="s" x="906" y="208">beads settled by a 1 min spin</text>
  <!-- transmitted light -->
  <line x1="1090" y1="199" x2="1124" y2="199" stroke="#7d7c77" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#gr)"/>
  <rect class="b" x="1000" y="290" width="160" height="96" rx="10"/><text class="t" x="1014" y="315">Transmitted</text><text class="t" x="1014" y="333">light (TD)</text>
  <text class="s" x="1014" y="353">find beads, measure R,</text><text class="s" x="1014" y="370">judge focus: no PE dose</text>
  <path d="M1130 210 L1130 290" stroke="#7d7c77" stroke-width="2.5" stroke-dasharray="5 4" fill="none" marker-end="url(#gr)"/>
  <!-- power meter -->
  <rect class="b" x="780" y="290" width="190" height="78" rx="10" style="stroke-dasharray:5 4"/><text class="t" x="796" y="315">Power meter</text>
  <text class="s" x="796" y="336">at the sample plane (Exp 1):</text><text class="s" x="796" y="353">1–2 µW is the default</text>
  <!-- Perfect Focus -->
  <rect class="b" x="560" y="290" width="200" height="78" rx="10"/><text class="t" x="576" y="315">Perfect Focus</text>
  <text class="s" x="576" y="336">holds the offset to the</text><text class="s" x="576" y="353">measured flat point of F</text>
  <line x1="745" y1="290" x2="745" y2="246" stroke="#7d7c77" stroke-width="2" marker-end="url(#gr)"/>

  <!-- emission path -->
  <path d="M890 214 L832 214 M660 214 L592 214 M420 214 L330 214" stroke="#eb6834" stroke-width="3.5" stroke-dasharray="9 5" fill="none"/>
  <path d="M320 214 L320 300" stroke="#eb6834" stroke-width="3.5" stroke-dasharray="9 5" fill="none" marker-end="url(#em)"/>
  <text class="s" x="340" y="262" fill="#b9461b">PE emission, descanned</text>
  <rect class="b" x="235" y="300" width="170" height="70" rx="10"/><text class="t" x="251" y="325">Pinhole: 1 AU</text>
  <text class="s" x="251" y="346">sets the section: 2.3 µm</text><text class="s" x="251" y="362">(20x) or 7.1 µm (10x)</text>
  <path d="M320 370 L320 410" stroke="#eb6834" stroke-width="3.5" stroke-dasharray="9 5" fill="none" marker-end="url(#em)"/>
  <rect class="b" x="235" y="410" width="170" height="62" rx="10"/><text class="t" x="251" y="435">Emission filter</text>
  <text class="s" x="251" y="456">≈ 575–650 nm</text>
  <path d="M320 472 L320 512" stroke="#eb6834" stroke-width="3.5" stroke-dasharray="9 5" fill="none" marker-end="url(#em)"/>
  <rect class="b" x="215" y="512" width="210" height="96" rx="10"/><text class="t" x="231" y="537">GaAsP detector</text>
  <text class="s" x="231" y="558">HV: brightest standard's rim</text><text class="s" x="231" y="575">at 70–80 % of full scale</text><text class="s" x="231" y="592">offset: background above 0</text>
  <text class="s" x="40" y="630">12-bit by default; check linearity with an ND ladder (Exp 2).</text>

  <!-- settings panel -->
  <rect x="480" y="410" width="680" height="290" rx="12" fill="#f6f5f2" stroke="#dedcd6"/>
  <text x="500" y="440" font-size="16" font-weight="700" fill="#1b1b1a">Recommended read (report, Part D)</text>
  <g>
    <text class="kb" x="500" y="470">Mode</text><text class="k" x="640" y="470">20x, 1 AU; one plane; one frame; one field per well (≈ 240 beads)</text>
    <text class="kb" x="500" y="496">Laser</text><text class="k" x="640" y="496">561 nm, 1–2 µW at the sample (F stays within 5 % of linear to ≈ 5 µW)</text>
    <text class="kb" x="500" y="522">Scan</text><text class="k" x="640" y="522">galvano 2 µs (1 µs if the lowest standards are not needed), 2048² zoom 1</text>
    <text class="kb" x="500" y="548">Focus</text><text class="k" x="640" y="548">Perfect Focus or TD, then the measured offset to where F is flat</text>
    <text class="kb" x="500" y="574">Measure</text><text class="k" x="640" y="574">F per bead: sum over R + 2.5 µm minus the background ring; median of ≥ 100</text>
    <text class="kb" x="500" y="600">Segment</text><text class="k" x="640" y="600">on transmitted light, never on PE (avoids picking only bright beads)</text>
    <text class="kb" x="500" y="626">Bleaching</text><text class="k" x="640" y="626">≈ 0.05 % per frame; never focus in PE; same frames and power in every well</text>
    <text class="kb" x="500" y="652">Timing</text><text class="k" x="640" y="652">fixed, logged delay from wash to image; stagger the wash by column</text>
    <text class="kb" x="500" y="678">Open</text><text class="k" x="640" y="678">which 20x is fitted; bead material; TD and Perfect Focus present? (Part E)</text>
  </g>
</svg></body></html>
